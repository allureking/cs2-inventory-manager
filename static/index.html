              <input type="file" accept=".xlsx" class="hidden" @change="trackerImportExcel($event)">
            </label>
            <a :href="'/api/tracker/export'" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-300" x-text="t('tracker_export')"></a>
          </div>
        </div>

        <!-- Summary Cards (latest day) -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" x-show="trackerData.length > 0">
          <template x-for="card in [
            {label: t('tracker_col_income'), value: trackerData[0]?.daily_income, prefix: '¥', fmt: 'number'},
            {label: t('tracker_col_combined'), value: trackerData[0]?.combined_annual, suffix: '%', fmt: 'pct'},
            {label: t('tracker_col_rented'), value: trackerData[0]?.rented_count, fmt: 'int'},
            {label: t('tracker_col_inv_value'), value: trackerData[0]?.inventory_value, prefix: '¥', fmt: 'number'},
            {label: t('tracker_col_change'), value: trackerData[0]?.price_change, suffix: '%', fmt: 'pct'},
          ]" :key="card.label">
            <div class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/50">
              <div class="text-[11px] text-slate-500 mb-1" x-text="card.label"></div>
              <div class="text-base font-mono font-bold"
                :class="card.fmt==='pct' && card.value > 0 ? 'text-emerald-400' : card.fmt==='pct' && card.value < 0 ? 'text-red-400' : 'text-white'"
                x-text="card.value != null ? ((card.prefix||'') + (card.fmt==='pct' ? (card.value*100).toFixed(2) : card.fmt==='int' ? Math.round(card.value).toLocaleString() : Number(card.value).toLocaleString('en-US', {maximumFractionDigits:2})) + (card.suffix||'')) : '—'">
              </div>
            </div>
          </template>
        </div>

        <!-- 成本基准 + 加减仓 -->
        <div class="flex items-center gap-3 mt-3 px-1" x-show="trackerData.length > 0">
          <span class="text-[11px] text-slate-600" x-text="nameLang==='cn'?'当前成本基准':'Cost Basis'"></span>
          <span class="text-xs font-mono text-slate-300">¥<span x-text="trackerData[0]?.cost_basis ? Number(trackerData[0].cost_basis).toLocaleString() : '—'"></span></span>
          <template x-if="!_costAdjustOpen">
            <button @click="_costAdjustOpen=true; _costAdjustVal=''"
              class="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-700 hover:bg-slate-600 text-slate-400 transition-all"
              x-text="nameLang==='cn'?'加仓 / 减仓':'Adjust'">
            </button>
          </template>
          <template x-if="_costAdjustOpen">
            <div class="flex items-center gap-2">
              <input type="text" x-ref="costAdjustInput" x-model="_costAdjustVal"
                class="w-32 px-2 py-1 rounded-lg text-xs font-mono" placeholder="+100000 / -50000"
                style="background:rgba(15,23,42,0.8); border:1px solid rgba(51,65,85,0.5); color:#e2e8f0"
                @keydown.enter="applyCostAdjust()" @keydown.escape="_costAdjustOpen=false"
                x-init="$nextTick(()=>$refs.costAdjustInput?.focus())" />
              <button @click="applyCostAdjust()" class="px-2 py-1 rounded text-[10px] font-medium bg-emerald-600 hover:bg-emerald-500 text-white"
                x-text="nameLang==='cn'?'确认':'Apply'"></button>
              <button @click="_costAdjustOpen=false" class="px-2 py-1 rounded text-[10px] font-medium bg-slate-700 hover:bg-slate-600 text-slate-400"
                x-text="nameLang==='cn'?'取消':'Cancel'"></button>
            </div>
          </template>
        </div>

        <!-- Chart -->
        <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50">
          <div class="flex items-center gap-2 mb-3">
            <template x-for="ct in [
              {key:'combined_annual', cn:'综合年化', en:'Combined Annual'},
              {key:'daily_income', cn:'日租金', en:'Daily Income'},
              {key:'inventory_value', cn:'库存价值', en:'Inventory Value'},
              {key:'price_change', cn:'涨跌', en:'Change'},
            ]">
              <button @click="trackerChartType=ct.key; renderTrackerChart()"
                class="px-2 py-1 rounded text-xs transition-all"
                :class="trackerChartType===ct.key ? 'bg-blue-600 text-white' : 'text-slate-500 hover:text-slate-300'"
                x-text="nameLang==='cn' ? ct.cn : ct.en"></button>
            </template>
            <span class="text-slate-700 mx-1">|</span>
            <template x-for="g in [{key:'daily',cn:'日',en:'D'},{key:'hourly',cn:'时',en:'H'}]">
              <button @click="trackerGranularity=g.key; renderTrackerChart()"
                class="px-1.5 py-1 rounded text-xs transition-all"
                :class="trackerGranularity===g.key ? 'bg-slate-600 text-white' : 'text-slate-600 hover:text-slate-400'"
                x-text="nameLang==='cn' ? g.cn : g.en"></button>
            </template>
          </div>
          <div id="trackerChart"></div>
        </div>

        <!-- Monthly Summary -->
        <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50" x-show="trackerMonthly.length > 0">
          <h3 class="text-sm font-bold text-white mb-3" x-text="t('tracker_monthly_title')"></h3>
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead>
                <tr class="text-slate-500 border-b border-slate-700/50">
                  <th class="py-2 px-2 text-left" x-text="nameLang==='cn'?'月份':'Month'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'天数':'Days'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'总收入':'Income'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'服务费':'Fee'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'净租金':'Net'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'净租金年化':'Annual'"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="m in trackerMonthly" :key="m.year+'-'+m.month">
                  <tr class="border-b border-slate-700/30 hover:bg-slate-700/20">
                    <td class="py-2 px-2 text-slate-300" x-text="m.year+'-'+(m.month<10?'0':'')+m.month"></td>
                    <td class="py-2 px-2 text-right text-slate-400">
                      <span x-text="m.days"></span><span class="text-slate-600" x-show="m.is_estimated" x-text="'/'+m.days_in_month"></span>
                    </td>
                    <td class="py-2 px-2 text-right font-mono" :class="m.is_estimated?'text-slate-400 italic':'text-white'"
                      :title="m.is_estimated?(nameLang==='cn'?'预估('+m.days+'天数据→'+m.days_in_month+'天)':'Est.('+m.days+'d→'+m.days_in_month+'d)'):''">
                      <span x-text="'¥'+Number(m.is_estimated?m.est_total_income:m.total_income||0).toLocaleString('en-US',{maximumFractionDigits:0})"></span>
                      <span x-show="m.is_estimated" class="text-[9px] text-slate-500 ml-0.5">~</span>
                    </td>
                    <td class="py-2 px-2 text-right text-red-400 font-mono" :class="m.is_estimated?'italic':''">
                      <span x-text="'¥'+Number(m.is_estimated?m.est_service_fee:m.service_fee||0).toLocaleString('en-US',{maximumFractionDigits:0})"></span>
                      <span x-show="m.is_estimated" class="text-[9px] text-slate-500 ml-0.5">~</span>
                    </td>
                    <td class="py-2 px-2 text-right text-emerald-400 font-mono" :class="m.is_estimated?'italic':''">
                      <span x-text="'¥'+Number(m.is_estimated?m.est_net_rental:m.net_rental||0).toLocaleString('en-US',{maximumFractionDigits:0})"></span>
                      <span x-show="m.is_estimated" class="text-[9px] text-slate-500 ml-0.5">~</span>
                    </td>
                    <td class="py-2 px-2 text-right font-mono" :class="m.net_rental_annual>0?'text-emerald-400':'text-slate-500'" x-text="m.net_rental_annual!=null ? (m.net_rental_annual*100).toFixed(2)+'%' : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Daily Table -->
        <div class="bg-slate-800/60 rounded-xl border border-slate-700/50 overflow-hidden">
          <div class="overflow-x-auto tracker-daily-wrap">
            <table class="w-full text-xs tracker-daily">
              <thead>
                <tr class="text-slate-500 border-b border-slate-700/50 bg-slate-800/80">
                  <th class="py-2 px-2 text-left sticky left-0 bg-slate-800/80" x-text="t('tracker_col_date')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_rented')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_value')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_income')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_short')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_long')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_combined')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_per_item')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_inv_count')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_inv_value')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_change')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_index')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in trackerData.slice(0, trackerVisibleRows)" :key="row.date">
                  <tr class="border-b border-slate-700/30 hover:bg-slate-700/20">
                    <!-- 日期 (只读, hover 显示完整 UTC 时间戳) -->
                    <td class="py-1.5 px-2 text-slate-300 sticky left-0 bg-slate-900/80 font-mono"
                      :title="row.created_at ? new Intl.DateTimeFormat(nameLang==='cn'?'zh-CN':'en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short',timeZone:'America/Los_Angeles'}).format(new Date(row.created_at)) : ''"
                      x-text="row.date"></td>

                    <!-- 出租件数 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='rented_count'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='rented_count'" x-text="row.rented_count?.toLocaleString()??'—'"></span>
                      <input x-show="row._edit==='rented_count'" class="w-16 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.rented_count??''"
                        @blur="row._edit=''; trackerEditField(row.date,'rented_count',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 出租价值 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white font-mono cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='rented_value'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='rented_value'" x-text="row.rented_value!=null?'¥'+Number(row.rented_value).toLocaleString('en-US',{maximumFractionDigits:0}):'—'"></span>
                      <input x-show="row._edit==='rented_value'" class="w-24 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.rented_value??''"
                        @blur="row._edit=''; trackerEditField(row.date,'rented_value',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 日租金 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-amber-400 font-mono cursor-default"
                      :title="nameLang==='cn'?'双击修改 (支持公式如 =2400+65)':'Dbl-click to edit (formulas like =2400+65)'"
                      @dblclick="row._edit='daily_income'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='daily_income'" x-text="row.daily_income!=null?'¥'+Number(row.daily_income).toFixed(2):'—'"></span>
                      <input x-show="row._edit==='daily_income'" class="w-24 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.daily_income??''" placeholder="=2400+65"
                        @blur="row._edit=''; trackerEditField(row.date,'daily_income',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 短租年化 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400" x-text="row.short_lease_annual!=null?(row.short_lease_annual*100).toFixed(2)+'%':'—'"></td>
                    <!-- 长租年化 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400" x-text="row.long_lease_annual!=null?(row.long_lease_annual*100).toFixed(2)+'%':'—'"></td>
                    <!-- 综合年化 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono font-bold" :class="row.combined_annual>0?'text-emerald-400':'text-slate-500'" x-text="row.combined_annual!=null?(row.combined_annual*100).toFixed(2)+'%':'—'"></td>
                    <!-- 单件/天 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400" x-text="row.income_per_item!=null?'¥'+Number(row.income_per_item).toFixed(2):'—'"></td>

                    <!-- 总库存件数 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='total_inventory'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='total_inventory'" x-text="row.total_inventory?.toLocaleString()??'—'"></span>
                      <input x-show="row._edit==='total_inventory'" class="w-16 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.total_inventory??''"
                        @blur="row._edit=''; trackerEditField(row.date,'total_inventory',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 库存价值 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white font-mono cursor-default"
                      :title="nameLang==='cn'?'双击修改 (支持公式)':'Dbl-click to edit (formulas)'"
                      @dblclick="row._edit='inventory_value'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='inventory_value'" x-text="row.inventory_value!=null?'¥'+Number(row.inventory_value).toLocaleString('en-US',{maximumFractionDigits:0}):'—'"></span>
                      <input x-show="row._edit==='inventory_value'" class="w-28 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.inventory_value??''"
                        @blur="row._edit=''; trackerEditField(row.date,'inventory_value',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 涨跌 (双击编辑成本基准) -->
                    <td class="py-1.5 px-2 text-right font-mono relative cursor-default"
                      :class="row.price_change>0?'text-emerald-400':row.price_change<0?'text-red-400':'text-slate-500'"
                      :title="row.cost_basis ? ((nameLang==='cn'?'成本: ¥':'Cost: ¥') + Number(row.cost_basis).toLocaleString() + '\n' + (nameLang==='cn'?'双击修改成本':'Dbl-click to edit cost')) : (nameLang==='cn'?'双击设置成本':'Dbl-click to set cost')"
                      @dblclick="row._edit='cost_basis'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='cost_basis'" x-text="row.price_change!=null?(row.price_change*100).toFixed(2)+'%':'—'"></span>
                      <input x-show="row._edit==='cost_basis'" class="w-24 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.cost_basis??''" placeholder="成本"
                        @blur="row._edit=''; trackerEditField(row.date,'cost_basis',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 大盘指数 (双击编辑) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400 cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='steamdt_index'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='steamdt_index'" x-text="row.steamdt_index!=null?Number(row.steamdt_index).toFixed(2):'—'"></span>
                      <input x-show="row._edit==='steamdt_index'" class="w-16 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.steamdt_index??''"
                        @blur="row._edit=''; trackerEditField(row.date,'steamdt_index',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="text-center py-2" x-show="trackerData.length > trackerVisibleRows">
            <button @click="trackerVisibleRows = Math.min(trackerVisibleRows + 50, trackerData.length)" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
              <span x-text="(nameLang==='cn'?'加载更多（已显示 ':'Load more (showing ') + Math.min(trackerVisibleRows, trackerData.length) + '/' + trackerData.length + (nameLang==='cn'?' 条）':')')"></span> ↓
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- ════════════ CHANGELOG TAB ════════════ -->
    <div x-show="activeTab==='changelog'" class="fade-up">

      <!-- Header -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <h2 class="text-lg font-bold text-white" x-text="t('changelog_title')"></h2>
          <p class="text-xs text-slate-600 mt-0.5" x-text="t('changelog_subtitle')"></p>
        </div>
        <div class="text-xs text-slate-600">
          <span x-text="t('current_version')"></span>
          <span class="text-blue-400 font-mono font-bold ml-1">v0.9.1</span>
        </div>
      </div>

      <!-- Timeline -->
      <div class="space-y-6">
        <template x-for="release in changelogData" :key="release.version">
          <div class="card p-0 overflow-hidden">
            <!-- Version header -->
            <div class="px-5 py-4 flex items-center justify-between"
              style="border-bottom: 1px solid rgba(51,65,85,0.2)"
              :style="release.major ? 'background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.05))' : ''">
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold font-mono"
                  :class="release.major ? 'bg-blue-500/15 text-blue-400 ring-1 ring-blue-500/20' : 'bg-slate-700/50 text-slate-400'"
                  x-text="'v' + release.version"></span>
                <span class="text-sm font-semibold text-white" x-text="nameLang==='cn' ? release.title_cn : release.title_en"></span>
              </div>
              <span class="text-[11px] text-slate-600 font-mono" x-text="release.date"></span>
            </div>
            <!-- Changes list -->
            <div class="px-5 py-4 space-y-4">
              <!-- Added / 新增 -->
              <template x-if="release.added?.length">
                <div>
                  <p class="text-[10px] uppercase tracking-widest font-semibold text-emerald-500 mb-2" x-text="t('cl_added')"></p>
                  <ul class="space-y-1.5">
                    <template x-for="item in release.added">
                      <li class="flex items-start gap-2 text-xs">
                        <span class="text-emerald-500 mt-0.5 flex-shrink-0">+</span>
                        <span class="text-slate-400" x-text="nameLang==='cn' ? item[0] : item[1]"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Fixed / 修复 -->
              <template x-if="release.fixed?.length">
                <div>
                  <p class="text-[10px] uppercase tracking-widest font-semibold text-amber-500 mb-2" x-text="t('cl_fixed')"></p>
                  <ul class="space-y-1.5">
                    <template x-for="item in release.fixed">
                      <li class="flex items-start gap-2 text-xs">
                        <span class="text-amber-500 mt-0.5 flex-shrink-0">~</span>
                        <span class="text-slate-400" x-text="nameLang==='cn' ? item[0] : item[1]"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Changed / 变更 -->
              <template x-if="release.changed?.length">
                <div>
                  <p class="text-[10px] uppercase tracking-widest font-semibold text-blue-500 mb-2" x-text="t('cl_changed')"></p>
                  <ul class="space-y-1.5">
                    <template x-for="item in release.changed">
                      <li class="flex items-start gap-2 text-xs">
                        <span class="text-blue-500 mt-0.5 flex-shrink-0">△</span>
                        <span class="text-slate-400" x-text="nameLang==='cn' ? item[0] : item[1]"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Commits -->
              <div x-show="release.commits?.length" style="border-top: 1px solid rgba(51,65,85,0.2); padding-top: 12px;">
                <details class="group">
                  <summary class="text-[10px] uppercase tracking-widest text-slate-700 cursor-pointer hover:text-slate-500 transition-colors select-none">
                    <span x-text="t('cl_commits')"></span> (<span x-text="release.commits?.length"></span>)
                  </summary>
                  <ul class="mt-2 space-y-1">
                    <template x-for="c in release.commits">
                      <li class="flex items-start gap-2 text-[11px] font-mono">
                        <span class="text-slate-700 flex-shrink-0" x-text="c.hash"></span>
                        <span class="text-slate-600" x-text="c.msg"></span>
                        <span class="text-slate-800 ml-auto flex-shrink-0" x-text="c.date"></span>
                      </li>
                    </template>
                  </ul>
                </details>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ════════════ INVENTORY (embedded in overview) ════════════ -->
    <div x-show="activeTab==='overview'">

      <!-- Mini strip -->
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-2 px-1 text-[10px] text-slate-700 freshness-bar">
        <span x-show="overview.price_updated_at">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>
          <span x-text="t('ts_price')"></span>
          <span class="text-slate-500 font-mono" x-text="fmtUtcStr(overview.price_updated_at)"></span>
        </span>
        <span x-show="lastImportAt">
          <span class="text-slate-800">|</span>
          <span x-text="t('ts_sync')"></span>
          <span class="text-slate-500 font-mono" x-text="lastImportAt"></span>
        </span>
        <span class="text-slate-500/60 ml-auto">PT</span>
      </div>
      <!-- Quick filter chips -->
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <button @click="filters.pricedFilter='unpriced'; filters.status=''; page=1; loadItems()"
          class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all"
          :class="filters.pricedFilter==='unpriced' ? 'bg-amber-500/20 text-amber-400 ring-1 ring-amber-500/30' : 'text-slate-500 hover:text-slate-300 bg-slate-800/50'"
          x-text="t('btn_unpriced')"></button>
        <button @click="filters.status='rented_out'; filters.pricedFilter=''; page=1; loadItems()"
          class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all"
          :class="filters.status==='rented_out' ? 'bg-green-500/20 text-green-400 ring-1 ring-green-500/30' : 'text-slate-500 hover:text-slate-300 bg-slate-800/50'"
          x-text="t('status_rented')"></button>
        <button @click="filters.status=''; filters.pricedFilter=''; page=1; loadItems()"
          class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all"
          :class="!filters.status && !filters.pricedFilter ? 'bg-blue-500/20 text-blue-400 ring-1 ring-blue-500/30' : 'text-slate-500 hover:text-slate-300 bg-slate-800/50'"
          x-text="t('all_status')"></button>
      </div>

      <!-- Filter bar -->
      <div class="card px-4 py-3 mb-4">
        <div class="flex flex-wrap items-center gap-2">

          <!-- Search -->
          <div class="relative flex-1 min-w-[180px]">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 pointer-events-none"
              style="color:#475569" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" x-model="filters.search"
              @input.debounce.400ms="page=1; loadItems()"
              :placeholder="t('search_placeholder')"
              class="w-full pl-9 pr-3 py-2 rounded-xl text-sm border" />
          </div>

          <!-- Status -->
          <select x-model="filters.status" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border" style="min-width: 108px">
            <option value="" x-text="t('all_status')"></option>
            <option value="rented_out" x-text="t('status_rented')"></option>
            <option value="in_steam" x-text="t('status_steam')"></option>
            <option value="in_storage" x-text="t('status_storage')"></option>
          </select>

          <!-- Category filter -->
          <select x-model="filters.category" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border" style="min-width: 100px">
            <option value="" x-text="t('all_types')"></option>
            <optgroup :label="nameLang==='cn'?'近战':'Melee'">
              <option value="knife" x-text="t('cat_knife')"></option>
              <option value="glove" x-text="t('cat_glove')"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'枪械':'Weapons'">
              <option value="pistol" x-text="t('cat_pistol')"></option>
              <option value="rifle" x-text="t('cat_rifle')"></option>
              <option value="sniper" x-text="t('cat_sniper')"></option>
              <option value="smg" x-text="t('cat_smg')"></option>
              <option value="shotgun" x-text="t('cat_shotgun')"></option>
              <option value="mg" x-text="t('cat_mg')"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'饰品':'Cosmetics'">
              <option value="sticker" x-text="t('cat_sticker')"></option>
              <option value="patch" x-text="nameLang==='cn'?'布章':'Patch'"></option>
              <option value="graffiti" x-text="nameLang==='cn'?'涂鸦':'Graffiti'"></option>
              <option value="charm" x-text="nameLang==='cn'?'挂件':'Charm'"></option>
              <option value="musickit" x-text="nameLang==='cn'?'音乐盒':'Music Kit'"></option>
              <option value="agent" x-text="nameLang==='cn'?'特工':'Agent'"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'容器':'Containers'">
              <option value="case" x-text="t('cat_case')"></option>
              <option value="key" x-text="nameLang==='cn'?'钥匙/通行证':'Key/Pass'"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'品质':'Quality'">
              <option value="stattrak">StatTrak™</option>
              <option value="souvenir" x-text="nameLang==='cn'?'纪念品':'Souvenir'"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'磨损':'Wear'">
              <option value="fn" x-text="nameLang==='cn'?'崭新出厂 FN':'Factory New'"></option>
              <option value="mw" x-text="nameLang==='cn'?'略有磨损 MW':'Minimal Wear'"></option>
              <option value="ft" x-text="nameLang==='cn'?'久经沙场 FT':'Field-Tested'"></option>
              <option value="ww" x-text="nameLang==='cn'?'破损不堪 WW':'Well-Worn'"></option>
              <option value="bs" x-text="nameLang==='cn'?'战痕累累 BS':'Battle-Scarred'"></option>
            </optgroup>
          </select>

          <!-- Priced filter -->
          <select x-model="filters.pricedFilter" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border" style="min-width: 96px">
            <option value="" x-text="t('all_filter')"></option>
            <option value="priced" x-text="t('priced')"></option>
            <option value="unpriced" x-text="t('unpriced')"></option>
          </select>

          <!-- Show sold toggle -->
          <label class="pill-toggle" :class="showSold ? 'active-slate' : ''"
            @click="showSold=!showSold; page=1; loadItems()">
            <span x-text="t('show_sold')"></span>
            <div class="relative toggle-track" :style="showSold ? 'background:#475569' : 'background:#1e293b'">
              <div class="toggle-thumb" :style="showSold ? 'transform:translateX(12px)' : ''"></div>
            </div>
          </label>

          <!-- Dual price toggle -->
          <label class="pill-toggle" :class="dualPrice ? 'active-blue' : ''"
            @click="dualPrice=!dualPrice">
            <span x-text="t('dual_price')"></span>
            <div class="relative toggle-track" :style="dualPrice ? 'background:#1d4ed8' : 'background:#1e293b'">
              <div class="toggle-thumb" :style="dualPrice ? 'transform:translateX(12px)' : ''"></div>
            </div>
          </label>

          <!-- Cost sort shortcut -->
          <button @click="setSort('effective_price')"
            class="pill-toggle" :class="sortBy==='effective_price' ? 'active-blue' : ''">
            <span x-text="t('cost_sort')"></span> <span x-text="sortBy==='effective_price'?(sortOrder==='desc'?'↓':'↑'):'↕'"></span>
          </button>

          <!-- Page size -->
          <select x-model.number="pageSize" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border ml-auto" style="width: 70px">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
      </div>

      <!-- Table -->
      <div class="card overflow-hidden holdings-card">
        <div class="tbl-wrap holdings-table-wrap">
          <table class="w-full text-xs" style="border-collapse: separate; border-spacing: 0;">
            <thead>
              <tr style="border-bottom: 1px solid rgba(51,65,85,0.3);">
                <th class="py-3 px-4 text-left font-normal text-slate-700 uppercase tracking-wider w-8">#</th>
                <th class="py-3 px-4 text-left font-normal text-slate-700 uppercase tracking-wider" x-text="t('th_item')"></th>
                <th class="py-3 px-3 text-left font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('status')">
                  <span x-text="t('th_status')"></span> <span x-text="sortIcon('status')"></span>
                </th>
                <th class="py-3 px-3 text-right font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('abrade')">
                  <span x-text="t('th_abrade')"></span> <span x-text="sortIcon('abrade')"></span>
                </th>
                <template x-if="!dualPrice">
                  <th class="py-3 px-3 text-right font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('effective_price')">
                    <span x-text="t('th_cost')"></span> <span x-text="sortIcon('effective_price')"></span>
                  </th>
                </template>
                <template x-if="dualPrice">
                  <th class="py-3 px-3 text-right font-normal uppercase tracking-wider" style="color:#475569" x-text="t('th_auto_price')"></th>
                </template>
                <template x-if="dualPrice">
                  <th class="py-3 px-3 text-right font-normal uppercase tracking-wider" style="color:rgba(202,138,4,0.7)" x-text="t('th_manual_price')"></th>
                </template>
                <th class="py-3 px-3 text-right font-normal uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" style="color:#047857" @click="setSort('current_price')">
                  <span x-text="t('th_market_price')"></span> <span x-text="sortIcon('current_price')"></span>
                </th>
                <th class="py-3 px-2 text-right font-normal uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" style="color:#475569" @click="setSort('pnl')">
                  <span x-text="t('th_pnl')"></span> <span x-text="sortIcon('pnl')"></span>
                </th>
                <th class="py-3 px-2 text-right font-normal uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" style="color:#475569" @click="setSort('pnl_pct')">
                  <span x-text="t('th_pnl_pct')"></span> <span x-text="sortIcon('pnl_pct')"></span>
                </th>
                <th class="py-3 px-3 text-right font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('purchase_date')">
                  <span x-text="t('th_date')"></span> <span x-text="sortIcon('purchase_date')"></span>
                </th>
                <th class="py-3 px-3 text-left font-normal text-slate-700 uppercase tracking-wider" x-text="t('th_platform')"></th>
                <th class="py-3 px-4 w-10"></th>
              </tr>
            </thead>
            <tbody>
              <!-- Loading -->
              <template x-if="loading">
                <tr>
                  <td :colspan="dualPrice ? 12 : 11" class="py-24 text-center" style="color:#334155">
                    <div class="flex flex-col items-center gap-3">
                      <div class="w-6 h-6 rounded-full border-2 border-t-blue-500 animate-spin" style="border-color: rgba(51,65,85,0.4); border-top-color: #3b82f6"></div>
                      <span class="text-xs" x-text="t('loading')"></span>
                    </div>
                  </td>
                </tr>
              </template>

              <!-- Empty -->
              <template x-if="!loading && items.length === 0">
                <tr>
                  <td :colspan="dualPrice ? 12 : 11" class="py-24 text-center text-xs" style="color:#334155"
                    x-text="t('no_match')">
                  </td>
                </tr>
              </template>

              <!-- Rows -->
              <template x-for="(item, idx) in items" :key="item.id">
                <tr class="tbl-row" @click="openPanel(item)">
                  <td class="py-2.5 px-4 font-mono" style="color:#334155" x-text="(page-1)*pageSize+idx+1"></td>

                  <!-- Item name + icon -->
                  <td class="py-2.5 px-4">
                    <div class="flex items-center gap-2.5">
                      <div class="w-9 h-9 rounded-lg overflow-hidden flex-shrink-0" style="background:rgba(20,30,48,0.8)">
                        <img :src="iconUrl(item.icon_url)" class="w-full h-full object-cover"
                          @error="$el.src='/static/placeholder.svg'" loading="lazy" />
                      </div>
                      <div class="min-w-0">
                        <p class="font-medium leading-tight truncate" style="max-width:260px"
                          :style="rarityStyle(item.market_hash_name, item.item_type)"
                          x-text="nameLang==='cn' ? (item.name || item.market_hash_name) : item.market_hash_name"></p>
                        <p class="leading-tight truncate mt-0.5" style="max-width:260px; color:#334155"
                          x-text="nameLang==='cn' ? item.market_hash_name : item.name"></p>
                      </div>
                    </div>
                  </td>

                  <!-- Status badge -->
                  <td class="py-2.5 px-3">
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-medium tracking-wide"
                      :class="statusCls(item.status)" x-text="statusLbl(item.status)"></span>
                  </td>

                  <!-- Abrade -->
                  <td class="py-2.5 px-3 text-right font-mono" style="color:#334155"
                    x-text="item.abrade!=null ? item.abrade.toFixed(6) : '—'"></td>

                  <!-- Single price -->
                  <template x-if="!dualPrice">
                    <td class="py-2.5 px-3 text-right">
                      <span x-show="item.effective_price!=null" class="font-semibold"
                        :class="item.purchase_price_manual!=null ? 'text-yellow-300' : 'text-slate-100'"
                        x-text="'¥'+fmt(item.effective_price)"></span>
                      <span x-show="item.effective_price==null" style="color:#1e293b">—</span>
                    </td>
                  </template>

                  <!-- Auto price (dual) -->
                  <template x-if="dualPrice">
                    <td class="py-2.5 px-3 text-right" style="color:#475569">
                      <span x-show="item.purchase_price!=null" x-text="'¥'+fmt(item.purchase_price)"></span>
                      <span x-show="item.purchase_price==null" style="color:#1e293b">—</span>
                    </td>
                  </template>

                  <!-- Manual price (dual) -->
                  <template x-if="dualPrice">
                    <td class="py-2.5 px-3 text-right">
                      <span x-show="item.purchase_price_manual!=null"
                        class="text-yellow-300 font-semibold"
                        x-text="'¥'+fmt(item.purchase_price_manual)"></span>
                      <span x-show="item.purchase_price_manual==null" style="color:#1e293b">—</span>
                    </td>
                  </template>

                  <!-- Current market price -->
                  <td class="py-2.5 px-3 text-right font-mono">
                    <span x-show="item.current_price != null"
                      class="text-emerald-400/80 text-xs"
                      x-text="'¥'+fmt(item.current_price)"></span>
                    <span x-show="item.current_price == null" style="color:#1e293b">—</span>
                  </td>

                  <!-- P&L amount -->
                  <td class="py-2.5 px-2 text-right font-mono">
                    <span x-show="item.pnl != null" class="text-xs font-semibold" :class="pnlClass(item.pnl)"
                      x-text="(item.pnl >= 0 ? '+¥' : '-¥') + fmt(Math.abs(item.pnl))"></span>
                    <span x-show="item.pnl == null" class="text-slate-700">—</span>
                  </td>
                  <!-- P&L % -->
                  <td class="py-2.5 px-2 text-right font-mono">
                    <span x-show="item.pnl_pct != null" class="text-xs font-semibold" :class="pnlClass(item.pnl_pct)"
                      x-text="(item.pnl_pct >= 0 ? '+' : '') + item.pnl_pct + '%'"></span>
                    <span x-show="item.pnl_pct == null" class="text-slate-700">—</span>
                  </td>

                  <!-- Date -->
                  <td class="py-2.5 px-3 text-right font-mono" style="color:#334155" x-text="item.purchase_date||'—'"></td>

                  <!-- Platform -->
                  <td class="py-2.5 px-3" style="color:#334155" x-text="item.purchase_platform||'—'"></td>

                  <!-- Edit btn -->
                  <td class="py-2.5 px-4 text-center">
                    <div class="w-6 h-6 rounded-md flex items-center justify-center transition-colors"
                      style="background: rgba(30,41,59,0.5); color:#334155"
                      @mouseenter="$el.style.color='#94a3b8'" @mouseleave="$el.style.color='#334155'">
                      <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                      </svg>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Mobile card list (≤640px only; desktop table hidden) — pure presentation, reuses items + openPanel -->
        <div class="holdings-cards">
          <template x-if="loading">
            <div class="py-16 flex flex-col items-center gap-3" style="color:#334155">
              <div class="w-6 h-6 rounded-full border-2 animate-spin" style="border-color:rgba(51,65,85,0.4);border-top-color:#3b82f6"></div>
              <span class="text-xs" x-text="t('loading')"></span>
            </div>
          </template>
          <template x-if="!loading && items.length === 0">
            <div class="py-16 text-center text-xs" style="color:#334155" x-text="t('no_match')"></div>
          </template>
          <template x-for="(item, idx) in items" :key="'m'+item.id">
            <div class="hold-card" @click="openPanel(item)">
              <div class="hc-top">
                <img class="hc-img" :src="iconUrl(item.icon_url)" @error="$el.src='/static/placeholder.svg'" loading="lazy" />
                <div class="hc-name">
                  <p class="hc-title" :style="rarityStyle(item.market_hash_name, item.item_type)"
                    x-text="nameLang==='cn' ? (item.name || item.market_hash_name) : item.market_hash_name"></p>
                  <p class="hc-sub" x-text="nameLang==='cn' ? item.market_hash_name : item.name"></p>
                </div>
                <span class="hc-status px-2 py-0.5 rounded-full font-medium" :class="statusCls(item.status)" x-text="statusLbl(item.status)"></span>
              </div>
              <div class="hc-bottom">
                <span class="hc-field">
                  <span class="hc-lbl" x-text="t('th_market_price')"></span>
                  <span class="font-mono text-emerald-400/90" x-show="item.current_price!=null" x-text="'¥'+fmt(item.current_price)"></span>
                  <span x-show="item.current_price==null" style="color:#475569">—</span>
                </span>
                <span class="hc-field">
                  <span class="hc-lbl" x-text="t('th_pnl')"></span>
                  <span class="font-mono font-semibold" :class="pnlClass(item.pnl)" x-show="item.pnl!=null" x-text="(item.pnl>=0?'+¥':'-¥')+fmt(Math.abs(item.pnl))"></span>
                  <span x-show="item.pnl==null" style="color:#475569">—</span>
                </span>
                <span class="hc-field">
                  <span class="hc-lbl" x-text="t('th_pnl_pct')"></span>
                  <span class="font-mono font-semibold" :class="pnlClass(item.pnl_pct)" x-show="item.pnl_pct!=null" x-text="(item.pnl_pct>=0?'+':'')+item.pnl_pct+'%'"></span>
                  <span x-show="item.pnl_pct==null" style="color:#475569">—</span>
                </span>
              </div>
            </div>
          </template>
        </div>

        <!-- Pagination -->
        <div class="px-5 py-3 flex items-center justify-between"
          style="border-top: 1px solid rgba(51,65,85,0.2)">
          <p class="text-xs" style="color:#334155">
            <span x-text="t('total_records')"></span> <span class="text-slate-400 font-medium" x-text="total"></span> <span x-text="t('records_unit')"></span> ·
            <span x-text="t('page_prefix')"></span> <span class="text-slate-500" x-text="page"></span> /
            <span class="text-slate-500" x-text="Math.max(1,Math.ceil(total/pageSize))"></span>
          </p>
          <div class="flex items-center gap-1">
            <button class="pg-btn" @click="gotoPage(page-1)" :disabled="page<=1">‹</button>
            <template x-for="(p,i) in pageNums" :key="i">
              <template x-if="p==='...'">
                <span class="text-xs px-1" style="color:#334155">…</span>
              </template>
              <template x-if="p!=='...'">
                <button class="pg-btn" :class="p===page?'active':''" @click="gotoPage(p)" x-text="p"></button>
              </template>
            </template>
            <button class="pg-btn" @click="gotoPage(page+1)" :disabled="page>=Math.ceil(total/pageSize)">›</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ════════════ SYSTEM MONITORING (bottom of overview) ════════════ -->
    <div x-show="activeTab==='overview'" class="mt-6">
      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <p class="text-[11px] text-slate-600 uppercase tracking-widest" x-text="t('system_monitor')"></p>
          <button @click="loadMonitorStatus()" class="text-[10px] text-slate-600 hover:text-slate-400 transition-colors">
            ↻ <span x-text="t('btn_refresh')"></span>
          </button>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="p-3 rounded-xl" style="background: rgba(15,23,42,0.5); border: 1px solid rgba(51,65,85,0.2)">
            <p class="text-[10px] text-slate-600 mb-1" x-text="t('sys_status')"></p>
            <p class="text-sm font-semibold"
              :class="monitorStatus.status==='healthy' ? 'text-emerald-400' : 'text-amber-400'"
              x-text="monitorStatus.status || '—'"></p>
          </div>
          <div class="p-3 rounded-xl" style="background: rgba(15,23,42,0.5); border: 1px solid rgba(51,65,85,0.2)">
            <p class="text-[10px] text-slate-600 mb-1" x-text="t('sys_uptime')"></p>
            <p class="text-sm font-semibold text-slate-300" x-text="monitorStatus.uptime_human || '—'"></p>
          </div>
          <div class="p-3 rounded-xl" style="background: rgba(15,23,42,0.5); border: 1px solid rgba(51,65,85,0.2)">
            <p class="text-[10px] text-slate-600 mb-1" x-text="t('sys_db_size')"></p>
            <p class="text-sm font-semibold text-slate-300" x-text="monitorStatus.database?.size_mb ? monitorStatus.database.size_mb + ' MB' : '—'"></p>
          </div>
          <div class="p-3 rounded-xl" style="background: rgba(15,23,42,0.5); border: 1px solid rgba(51,65,85,0.2)">
            <p class="text-[10px] text-slate-600 mb-1" x-text="t('sys_collector')"></p>
            <p class="text-sm font-semibold"
              :class="monitorStatus.collector?.status==='running' ? 'text-blue-400' : 'text-slate-400'"
              x-text="monitorStatus.collector?.status || 'idle'"></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Detail Side Panel ─────────────────────────────────────────────── -->
  <template x-teleport="body">
    <div x-show="panel" x-cloak>
      <div class="fixed inset-0 backdrop-blur-sm"
        style="background:rgba(0,0,0,0.55); z-index:1000" @click="panel=null"></div>
      <div class="fixed top-0 right-0 h-full overflow-y-auto shadow-2xl slide-right"
        style="width:min(100vw,380px); background:#07101f; border-left:1px solid rgba(51,65,85,0.35); z-index:1001"
        x-show="panel">
        <div class="p-5 flex flex-col min-h-full">

          <!-- Header -->
          <div class="flex items-start gap-3 mb-4">
            <div class="flex-1 min-w-0">
              <h2 class="text-sm font-semibold text-white leading-snug" x-text="panel?.market_hash_name"></h2>
              <p class="text-xs mt-0.5" style="color:#475569" x-text="panel?.name"></p>
            </div>
            <button @click="panel=null"
              class="w-7 h-7 rounded-lg flex items-center justify-center transition-colors text-base leading-none flex-shrink-0"
              style="background:rgba(30,41,59,0.8); color:#475569"
              @mouseenter="$el.style.color='#e2e8f0'" @mouseleave="$el.style.color='#475569'">✕</button>
          </div>

          <!-- Image -->
          <div class="rounded-xl mb-4 flex items-center justify-center h-36 overflow-hidden"
            style="background:rgba(10,18,35,0.8); border:1px solid rgba(51,65,85,0.25)">
            <img :src="iconUrl(panel?.icon_url, 200)" class="max-h-full max-w-full object-contain"
              @error="$el.src='/static/placeholder.svg'" x-show="panel?.icon_url" />
            <span x-show="!panel?.icon_url" class="text-xs" style="color:#1e293b">No image</span>
          </div>

          <!-- Info grid -->
          <div class="grid grid-cols-2 gap-2 mb-5">
            <template x-for="[label,val,wide,yellow] in panelFields()" :key="label">
              <div class="rounded-xl p-3" :class="wide ? 'col-span-2' : ''"
                style="background:rgba(10,18,35,0.7); border:1px solid rgba(51,65,85,0.25)">
                <p class="text-[11px] mb-1" style="color:#475569" x-text="label"></p>
                <p class="text-xs font-medium font-mono"
                  :class="yellow ? 'text-yellow-300' : 'text-slate-200'"
                  x-text="val || '—'"></p>
              </div>
            </template>
          </div>

          <!-- Manual price -->
          <div class="mt-auto pt-4" style="border-top:1px solid rgba(51,65,85,0.3)">
            <div class="flex items-center justify-between mb-1">
              <p class="text-sm font-medium text-slate-200" x-text="t('manual_price_title')"></p>
              <span x-show="panel?.purchase_price_manual!=null"
                class="text-[11px] px-2 py-0.5 rounded-full font-medium"
                style="background:rgba(202,138,4,0.12); color:#fbbf24" x-text="t('manual_price_set')"></span>
            </div>
            <p class="text-[11px] mb-3" style="color:#334155" x-text="t('manual_price_desc')"></p>
            <div class="flex gap-2">
              <input type="number" x-model="manualInput" :placeholder="nameLang==='cn'?'金额（元）':'Amount (¥)'" step="0.01" min="0"
                @keydown.enter="saveManual()"
                class="flex-1 px-3 py-2 rounded-xl text-sm border" />
              <button @click="saveManual()" :disabled="saving"
                class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-900 transition-all disabled:opacity-40"
                style="background:linear-gradient(135deg,#d97706,#b45309); box-shadow:0 0 12px rgba(217,119,6,0.2)">
                <span x-show="!saving" x-text="t('btn_save')"></span><span x-show="saving">…</span>
              </button>
            </div>
            <button x-show="panel?.purchase_price_manual!=null" @click="clearManual()"
              class="mt-2 text-[11px] transition-colors"
              style="color:rgba(239,68,68,0.5)"
              @mouseenter="$el.style.color='rgba(239,68,68,0.8)'"
              @mouseleave="$el.style.color='rgba(239,68,68,0.5)'"
              x-text="'× '+t('btn_clear_manual')">
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ── Import Result Modal ─────────────────────────────────────────────── -->
  <template x-teleport="body">
    <div x-show="importResult" x-cloak
      class="fixed inset-0 flex items-center justify-center backdrop-blur-sm"
      style="background:rgba(0,0,0,0.65); z-index:9999"
      @click.self="importResult=null; loadAll()"
      @keydown.escape.window="importResult=null; loadAll()">
      <div class="flex flex-col rounded-2xl shadow-2xl fade-up"
        style="background:#07101f; border:1px solid rgba(51,65,85,0.4); width:420px; max-width:95vw; max-height:80vh">
        <!-- Header -->
        <div class="flex items-center justify-between px-5 pt-5 pb-3 flex-shrink-0">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs"
              style="background:rgba(34,197,94,0.12); color:#22c55e">✓</div>
            <h3 class="text-sm font-semibold text-white" x-text="t('import_done')"></h3>
          </div>
          <button @click="importResult=null; loadAll()"
            class="w-7 h-7 rounded-lg flex items-center justify-center text-base leading-none transition-colors"
            style="background:rgba(30,41,59,0.8); color:#475569"
            @mouseenter="$el.style.color='#e2e8f0'" @mouseleave="$el.style.color='#475569'">✕</button>
        </div>
        <!-- Scrollable content -->
        <div class="px-5 pb-3 overflow-y-auto flex-1 space-y-2">
          <template x-for="[sec,data] in Object.entries(importResult||{})" :key="sec">
            <div class="rounded-xl p-3.5" style="background:rgba(10,18,35,0.7); border:1px solid rgba(51,65,85,0.25)">
              <p class="text-xs font-semibold text-slate-300 mb-2.5" x-text="importLbl(sec)"></p>
              <template x-if="typeof data==='object' && data!==null">
                <div class="space-y-1.5">
                  <template x-for="[k,v] in importFields(data)" :key="k">
                    <div class="flex justify-between items-center">
                      <span class="text-[11px]" style="color:#475569" x-text="k"></span>
                      <span class="text-[11px] text-slate-200 font-mono font-medium" x-text="v"></span>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="typeof data!=='object' || data===null">
                <span class="text-[11px] text-slate-300 font-mono" x-text="data"></span>
              </template>
            </div>
          </template>
        </div>
        <!-- Sticky footer -->
        <div class="px-5 pb-5 pt-3 flex-shrink-0" style="border-top:1px solid rgba(51,65,85,0.25)">
          <button @click="importResult=null; loadAll()"
            class="w-full py-2.5 rounded-xl text-sm font-semibold text-white transition-all"
            style="background:linear-gradient(135deg,#1d4ed8,#2563eb); box-shadow:0 0 20px rgba(37,99,235,0.25)"
            @mouseenter="$el.style.boxShadow='0 0 28px rgba(37,99,235,0.4)'"
            @mouseleave="$el.style.boxShadow='0 0 20px rgba(37,99,235,0.25)'">
            <span x-text="t('btn_refresh_data')"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ── Toast ──────────────────────────────────────────────────────────── -->
  <template x-teleport="body">
    <div x-show="toast.msg" x-cloak class="fixed bottom-6 right-6 toast-pop" style="z-index:9999">
      <div class="px-4 py-3 rounded-xl text-sm font-medium shadow-2xl"
        :style="toast.type==='success'
          ? 'background:rgba(21,128,61,0.95); color:#dcfce7; border:1px solid rgba(34,197,94,0.3)'
          : 'background:rgba(185,28,28,0.95); color:#fee2e2; border:1px solid rgba(239,68,68,0.3)'"
        x-text="toast.msg"></div>
    </div>
  </template>

</body>
</html>
