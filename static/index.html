                <th class="py-2 px-2 text-right">RSI</th>
              </tr></thead>
              <tbody>
                <template x-for="c in (ao.category_trends||[])">
                  <tr class="border-t" style="border-color:rgba(51,65,85,0.2)">
                    <td class="py-2 px-3 font-medium text-slate-300" x-text="catLabel(c.category)"></td>
                    <td class="py-2 px-2 text-right font-mono text-slate-400" x-text="c.count"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="pnlClass(c.avg_momentum_7)" x-text="c.avg_momentum_7!==null?(c.avg_momentum_7>0?'+':'')+c.avg_momentum_7+'%':'—'"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="pnlClass(c.avg_momentum_30)" x-text="c.avg_momentum_30!==null?(c.avg_momentum_30>0?'+':'')+c.avg_momentum_30+'%':'—'"></td>
                    <td class="py-2 px-2 text-right font-mono text-slate-400" x-text="c.avg_rsi??'—'"></td>
                  </tr>
                </template>
                <tr x-show="!ao.category_trends?.length"><td colspan="5" class="py-6 text-center text-slate-600">—</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="flex gap-3 mt-4">
          <button @click="triggerBackfill()" :disabled="backfillRunning"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50">
            <span x-show="!backfillRunning" x-text="t('btn_backfill')"></span>
            <span x-show="backfillRunning" x-cloak x-text="t('backfilling')+' '+backfillProgress"></span>
          </button>
          <button @click="triggerComputeNow()" :disabled="computingSignals"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-white disabled:opacity-50">
            <span x-show="!computingSignals" x-text="t('btn_compute')"></span>
            <span x-show="computingSignals" x-cloak x-text="t('computing')"></span>
          </button>
          <button @click="collectNow()" :disabled="ao.collector?.status==='running'"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-white disabled:opacity-50">
            <span x-text="ao.collector?.status==='running'?t('collecting'):t('btn_collect')"></span>
          </button>
          <button @click="triggerCsqaqSync()"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-teal-700 hover:bg-teal-600 text-white">
            <span x-text="nameLang==='cn'?'CSQAQ 同步':'CSQAQ Sync'"></span>
          </button>
        </div>
      </div>

      <!-- ── Sub: Item Detail ── -->
      <div x-show="analysisTab==='detail'">
        <!-- Search bar -->
        <div class="flex gap-3 mb-4">
          <div class="relative flex-1">
            <input type="text" x-model="analysisSearch" @input.debounce.300ms="searchAnalysisItems()"
              :placeholder="t('search_item_hint')" class="w-full px-4 py-2.5 rounded-xl text-sm text-white placeholder-slate-600"
              style="background:rgba(15,23,42,0.8); border:1px solid rgba(51,65,85,0.3)" />
            <div x-show="analysisSearchResults.length>0" x-cloak
              class="absolute z-50 left-0 right-0 top-full mt-1 rounded-xl overflow-hidden shadow-xl max-h-60 overflow-y-auto"
              style="background:rgba(15,23,42,0.95); border:1px solid rgba(51,65,85,0.4)">
              <template x-for="r in analysisSearchResults">
                <div @click="analysisSelectedItem=r.market_hash_name; analysisSearch=r.market_hash_name; analysisSearchResults=[]; loadItemSignals(r.market_hash_name)"
                  class="px-4 py-2 text-xs text-slate-300 hover:bg-slate-700/50 cursor-pointer truncate" x-text="r.market_hash_name"></div>
              </template>
            </div>
          </div>
        </div>

        <template x-if="itemSignals">
          <div>
            <!-- Price Chart -->
            <div class="card p-4 mb-4">
              <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-lg overflow-hidden flex-shrink-0" style="background:rgba(20,30,48,0.8)" x-show="itemSignals.icon_url">
                    <img :src="iconUrl(itemSignals.icon_url)" class="w-full h-full object-cover" @error="$el.src='/static/placeholder.svg'" loading="lazy" />
                  </div>
                  <div>
                    <p class="text-sm font-medium" :style="rarityStyle(analysisSelectedItem)"
                      x-text="nameLang==='cn' ? (itemSignals.name||analysisSelectedItem) : analysisSelectedItem"></p>
                    <p class="text-[10px]" style="color:#475569" x-text="nameLang==='cn' ? analysisSelectedItem : (itemSignals.name||'')"></p>
                  </div>
                </div>
                <div class="flex gap-1">
                  <template x-for="d in [30,60,90,0]">
                    <button @click="chartDays=d; renderPriceChart()"
                      class="px-2 py-0.5 rounded text-[10px]"
                      :class="chartDays===d?'bg-slate-600 text-white':'text-slate-500 hover:text-slate-300'"
                      x-text="d===0?(nameLang==='cn'?'全部':'All'):(d+(nameLang==='cn'?'天':'D'))"></button>
                  </template>
                </div>
              </div>
              <div class="relative" style="height:280px">
                <canvas id="priceChart"></canvas>
              </div>
            </div>

            <!-- Signal Gauges -->
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-4">
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1">RSI(14)
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'相对强弱指标 (14日)。>70 超买(可能回调)，<30 超卖(可能反弹)，50 中性。':'RSI(14). >70 overbought, <30 oversold, 50 neutral.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.rsi_14||0)>70?'text-red-400':(itemSignals.signal?.rsi_14||0)<30?'text-emerald-400':'text-slate-300'" x-text="itemSignals.signal?.rsi_14??'—'"></p>
                <p class="text-[9px] mt-0.5" :class="(itemSignals.signal?.rsi_14||0)>70?'text-red-500':'text-slate-600'" x-text="(itemSignals.signal?.rsi_14||0)>70?t('overbought'):(itemSignals.signal?.rsi_14||0)<30?t('oversold'):t('neutral_rsi')"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1">Bollinger %B
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'布林带位置。基于20日均线±2σ。>1 突破上轨(超涨)，<0 跌破下轨(超跌)，0.5 居中。':'Bollinger %B. Based on 20D MA ±2σ. >1 above upper band, <0 below lower, 0.5 mid.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.bb_position||0)>1?'text-red-400':(itemSignals.signal?.bb_position||0)<0?'text-emerald-400':'text-slate-300'" x-text="itemSignals.signal?.bb_position??'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="(itemSignals.signal?.bb_position||0)>1?t('above_upper'):(itemSignals.signal?.bb_position||0)<0?t('below_lower'):t('in_band')"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'7D 动量':'7D Momentum'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'7天价格变化率。(今价-7天前价)/7天前价×100%。正值=上涨趋势，负值=下跌趋势。':'7-day price change rate. Positive=uptrend, Negative=downtrend.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="pnlClass(itemSignals.signal?.momentum_7||0)" x-text="itemSignals.signal?.momentum_7!==null?(itemSignals.signal.momentum_7>0?'+':'')+itemSignals.signal.momentum_7+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'30D 动量':'30D Momentum'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'30天价格变化率。反映中期趋势方向和力度。>10% 强势上涨，<-10% 显著下跌。':'30-day price change rate. >10% strong rally, <-10% significant decline.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="pnlClass(itemSignals.signal?.momentum_30||0)" x-text="itemSignals.signal?.momentum_30!==null?(itemSignals.signal.momentum_30>0?'+':'')+itemSignals.signal.momentum_30+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'波动率':'Volatility'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'30日年化波动率。基于每日收益率标准差×√365。高波动=价格不稳定/交易机会大，低波动=稳定。':'30D annualized volatility. High=unstable/trading opportunities, Low=stable.'"></span></span></p>
                <p class="text-xl font-bold font-mono text-slate-300" x-text="itemSignals.signal?.volatility_30?itemSignals.signal.volatility_30+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'ATH 距离':'ATH Distance'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'当前价格占历史最高价的百分比。>90% 接近峰值(考虑出售)，<50% 远离高点(可能低估)。':'Price as % of all-time high. >90% near peak (sell?), <50% far from ATH.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.ath_pct||0)>90?'text-yellow-300':'text-slate-300'" x-text="itemSignals.signal?.ath_pct?itemSignals.signal.ath_pct+'%':'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="itemSignals.signal?.ath_price?'ATH ¥'+itemSignals.signal.ath_price:''"></p>
              </div>
              <!-- Rental Yield -->
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('rental_yield')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="t('rental_yield_desc')"></span></span></p>
                <p class="text-xl font-bold font-mono"
                  :class="rentalYield(itemSignals)>15?'text-emerald-400':rentalYield(itemSignals)>8?'text-yellow-300':rentalYield(itemSignals)>0?'text-orange-400':'text-slate-500'"
                  x-text="rentalYield(itemSignals)>0?rentalYield(itemSignals)+'%':'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="rentalYield(itemSignals)>15?(nameLang==='cn'?'高收益':'High'):rentalYield(itemSignals)>8?(nameLang==='cn'?'中等':'Medium'):rentalYield(itemSignals)>0?(nameLang==='cn'?'偏低':'Low'):''"></p>
              </div>
            </div>

            <!-- New Dimension Gauges (CS2 Dealer Model) -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'盈亏率':'P&L Rate'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'当前市价相对购入价的盈亏百分比 = (市价-成本)/成本。':'Unrealized P&L % = (market price - cost) / cost.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.pnl_rate||0)>30?'text-emerald-400':(itemSignals.signal?.pnl_rate||0)>0?'text-yellow-300':(itemSignals.signal?.pnl_rate||0)>-10?'text-orange-400':'text-red-400'"
                  x-text="itemSignals.signal?.pnl_rate!=null?(itemSignals.signal.pnl_rate>0?'+':'')+itemSignals.signal.pnl_rate+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'含租预期收益':'Proj. Return'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'假设饰品价格不变，收一年租金后的总回报率 = (市价+年租金-成本)/成本。受大会员天数影响。':'Projected return assuming flat price + 1 year rental income. Affected by VIP membership days.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="projectedReturn(itemSignals)>30?'text-emerald-400':projectedReturn(itemSignals)>10?'text-yellow-300':projectedReturn(itemSignals)>0?'text-orange-400':'text-red-400'"
                  x-text="projectedReturn(itemSignals)!=null?(projectedReturn(itemSignals)>0?'+':'')+projectedReturn(itemSignals)+'%':'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="youpinMembership?(nameLang==='cn'?'310天/年':'310d/yr'):(nameLang==='cn'?'188天/年':'188d/yr')"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_holding_count')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'当前持有该饰品的件数。>20件建议关注集中度风险。':'Number of units held. >20 units warrants concentration review.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.holding_count||0)>50?'text-red-400':(itemSignals.signal?.holding_count||0)>20?'text-orange-400':'text-slate-300'"
                  x-text="itemSignals.signal?.holding_count??'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_concentration')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'该饰品市值占总持仓的百分比。>15%仓位过重需减仓，<5%正常。':'Portfolio weight %. >15% overweight, <5% normal.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.concentration_pct||0)>15?'text-red-400':(itemSignals.signal?.concentration_pct||0)>5?'text-orange-400':'text-slate-300'"
                  x-text="itemSignals.signal?.concentration_pct!=null?itemSignals.signal.concentration_pct+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_market_share')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'持有件数占市场在售总量的比例。>30%卖出可能造成砸盘，>10%需谨慎出货。':'Holding vs market supply. >30% selling may crash price, >10% trade carefully.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.market_share_pct||0)>30?'text-red-400':(itemSignals.signal?.market_share_pct||0)>10?'text-orange-400':'text-slate-300'"
                  x-text="itemSignals.signal?.market_share_pct!=null?itemSignals.signal.market_share_pct+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_vol_zscore')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'该饰品波动率相对同类饰品的偏离程度(Z值)。>2为显著异常波动，<-1.5为异常平静。':'Volatility z-score vs peers. >2 = significant anomaly, <-1.5 = unusually calm.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.volatility_zscore||0)>2?'text-red-400':(itemSignals.signal?.volatility_zscore||0)>1?'text-orange-400':(itemSignals.signal?.volatility_zscore||0)<-1.5?'text-cyan-400':'text-slate-300'"
                  x-text="itemSignals.signal?.volatility_zscore!=null?itemSignals.signal.volatility_zscore:'—'"></p>
              </div>
            </div>

            <!-- CSQAQ Market Data Gauges -->
            <div class="grid grid-cols-3 gap-3 mb-4" x-show="itemSignals.signal?.daily_rent||itemSignals.signal?.steam_turnover||itemSignals.signal?.global_supply">
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'日租金':'Daily Rent'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'悠悠有品市场日租金均价（CSQAQ 数据）。':'Average daily rental price on UUYP market (CSQAQ data).'"></span></span></p>
                <p class="text-xl font-bold font-mono text-emerald-400"
                  x-text="itemSignals.signal?.daily_rent?'¥'+itemSignals.signal.daily_rent:'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'Steam 成交量':'Steam Turnover'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'Steam 市场近期成交量。高成交 = 流动性好，低成交 = 难出手。':'Steam market recent turnover. High = good liquidity.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.steam_turnover||0)>1000?'text-emerald-400':(itemSignals.signal?.steam_turnover||0)>200?'text-yellow-300':'text-orange-400'"
                  x-text="itemSignals.signal?.steam_turnover!=null?itemSignals.signal.steam_turnover.toLocaleString():'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'全球存世量':'Global Supply'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'全球饰品存世总量（CSQAQ 统计）。稀有度影响长期价值。':'Total global supply of this skin (CSQAQ stats). Rarity affects long-term value.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.global_supply||0)<5000?'text-purple-400':(itemSignals.signal?.global_supply||0)<50000?'text-yellow-300':'text-slate-300'"
                  x-text="itemSignals.signal?.global_supply!=null?itemSignals.signal.global_supply.toLocaleString():'—'"></p>
              </div>
            </div>

            <!-- Sell Score + Ownership -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
              <div class="card p-4">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-1"><span x-text="t('sell_score_title')"></span>
                      <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                        <span class="tip-text" x-text="t('sell_score_desc')"></span></span></p>
                    <p class="text-3xl font-bold font-mono" :class="scoreColor(itemSignals.signal?.sell_score)" x-text="itemSignals.signal?.sell_score??'—'"></p>
                    <p class="text-xs mt-1" :class="scoreColor(itemSignals.signal?.sell_score)" x-text="scoreLabel(itemSignals.signal?.sell_score)"></p>
                  </div>
                  <div class="text-right">
                    <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-1"><span x-text="t('buy_opp_title')"></span></p>
                    <p class="text-xl font-bold font-mono text-cyan-400" x-text="itemSignals.signal?.opportunity_score??'—'"></p>
                    <p class="text-[9px] text-slate-700 mt-0.5" x-text="t('buy_opp_note')"></p>
                  </div>
                </div>
              </div>
              <div class="card p-4" x-show="itemSignals.ownership">
                <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-2" x-text="t('ownership_title')"></p>
                <div class="space-y-1.5 text-xs">
                  <div class="flex justify-between"><span class="text-slate-500" x-text="t('ownership_buy')"></span><span class="font-mono text-slate-300" x-text="itemSignals.ownership?.purchase_price?'¥'+itemSignals.ownership.purchase_price:t('unknown')"></span></div>
                  <div class="flex justify-between"><span class="text-slate-500" x-text="t('ownership_current')"></span><span class="font-mono text-slate-300" x-text="itemSignals.ownership?.current_price?'¥'+itemSignals.ownership.current_price:'—'"></span></div>
                  <div class="flex justify-between"><span class="text-slate-500" x-text="t('ownership_pnl')"></span>
                    <span class="font-mono font-bold" :class="pnlClass(itemSignals.ownership?.pnl||0)"
                      x-text="itemSignals.ownership?.pnl!==null?((itemSignals.ownership.pnl>=0?'+':'')+'¥'+itemSignals.ownership.pnl+' ('+itemSignals.ownership.pnl_pct+'%)'):'—'"></span>
                  </div>
                  <div class="flex justify-between"><span class="text-slate-500" x-text="nameLang==='cn'?'持有件数':'Held'"></span><span class="font-mono text-slate-300" x-text="itemSignals.ownership?.count??'—'"></span></div>
                  <div class="flex justify-between" x-show="itemSignals.ownership?.target_pnl_pct"><span class="text-slate-500" x-text="nameLang==='cn'?'目标收益':'Target'"></span><span class="font-mono text-slate-300" x-text="itemSignals.ownership?.target_pnl_pct?itemSignals.ownership.target_pnl_pct+'%':'—'"></span></div>
                </div>
              </div>
            </div>

            <!-- Cross-platform prices -->
            <div class="card overflow-hidden" x-show="itemSignals.platforms?.length">
              <div class="px-4 py-3 border-b" style="border-color:rgba(51,65,85,0.3)">
                <p class="text-[11px] text-slate-500 font-medium" x-text="t('cross_platform')"></p>
              </div>
              <table class="w-full text-xs">
                <thead><tr class="text-[10px] text-slate-600 uppercase" style="background:rgba(15,23,42,0.5)">
                  <th class="py-2 px-3 text-left" x-text="t('th_platform')"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'卖价':'Sell'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'求购价':'Bid'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'在售':'Listed'"></th>
                </tr></thead>
                <tbody>
                  <template x-for="p in itemSignals.platforms">
                    <tr class="border-t" style="border-color:rgba(51,65,85,0.2)">
                      <td class="py-2 px-3 text-slate-300" x-text="p.platform"></td>
                      <td class="py-2 px-2 text-right font-mono text-slate-300" x-text="p.sell_price?'¥'+p.sell_price:'—'"></td>
                      <td class="py-2 px-2 text-right font-mono text-slate-400" x-text="p.bidding_price?'¥'+p.bidding_price:'—'"></td>
                      <td class="py-2 px-2 text-right font-mono text-slate-500" x-text="p.sell_count??'—'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
        <div x-show="!itemSignals">
          <p class="text-xs text-slate-600 mb-3" x-text="t('recommend_hint')"></p>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" x-show="analysisTopItems.length">
            <template x-for="ti in analysisTopItems">
              <div class="card p-3 cursor-pointer hover:ring-1 hover:ring-slate-600 transition-all"
                @click="analysisSelectedItem=ti.market_hash_name; analysisSearch=ti.market_hash_name; loadItemSignals(ti.market_hash_name)">
                <div class="flex items-center gap-2 mb-2">
                  <div class="w-8 h-8 rounded overflow-hidden flex-shrink-0" style="background:rgba(20,30,48,0.8)" x-show="ti.icon_url">
                    <img :src="iconUrl(ti.icon_url)" class="w-full h-full object-cover" @error="$el.src='/static/placeholder.svg'" loading="lazy" />
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-medium truncate" :style="rarityStyle(ti.market_hash_name)"
                      x-text="nameLang==='cn' ? (ti.name||ti.market_hash_name) : ti.market_hash_name"></p>
                    <p class="text-[10px] truncate" style="color:#475569"
                      x-text="nameLang==='cn' ? ti.market_hash_name : (ti.name||'')"></p>
                  </div>
                </div>
                <div class="flex items-center gap-3 text-[10px]">
                  <span class="font-mono" :class="scoreColor(ti.sell_score)">Score <span x-text="ti.sell_score??'—'"></span></span>
                  <span class="text-slate-500" x-text="ti.rsi_14?'RSI '+ti.rsi_14:'RSI —'"></span>
                  <span class="font-mono" :class="pnlClass(ti.momentum_30||0)"
                    x-text="ti.momentum_30!=null?((ti.momentum_30>0?'+':'')+ti.momentum_30+'%'):'—'"></span>
                </div>
              </div>
            </template>
          </div>
          <div x-show="!analysisTopItems.length" class="card p-8 text-center text-slate-700 text-xs" x-text="t('no_recommend')"></div>
        </div>
      </div>

      <!-- ── Sub: Alerts ── -->
      <div x-show="analysisTab==='alerts'">
        <div class="flex items-center gap-3 mb-4">
          <select x-model="alertFilter.severity" @change="loadAlerts(1)"
            class="px-3 py-2 rounded-lg text-xs" style="background:rgba(15,23,42,0.8); border:1px solid rgba(51,65,85,0.3); color:#94a3b8">
            <option value="" x-text="t('all_levels')"></option>
            <option value="critical" x-text="t('level_critical')"></option>
            <option value="warning" x-text="t('level_warning')"></option>
            <option value="info" x-text="t('level_info')"></option>
          </select>
          <select x-model="alertFilter.type" @change="loadAlerts(1)"
            class="px-3 py-2 rounded-lg text-xs" style="background:rgba(15,23,42,0.8); border:1px solid rgba(51,65,85,0.3); color:#94a3b8">
            <option value="" x-text="t('all_types_alert')"></option>
            <option value="profit_50">Profit>50%</option>
            <option value="profit_100">Profit>100%</option>
            <option value="near_ath">Near ATH</option>
            <option value="rsi_overbought">RSI OB</option>
            <option value="rsi_oversold">RSI OS</option>
            <option value="momentum_surge">Momentum</option>
            <option value="spread_arb">Spread</option>
          </select>
          <label class="flex items-center gap-1.5 text-xs text-slate-500">
            <input type="checkbox" x-model="alertFilter.unreadOnly" @change="loadAlerts(1)" class="rounded" /> <span x-text="t('unread_only')"></span>
          </label>
          <button @click="markAllAlertsRead()" class="ml-auto px-3 py-1.5 rounded-lg text-xs bg-slate-700 hover:bg-slate-600 text-slate-300" x-text="t('btn_mark_all_read')"></button>
        </div>

        <div class="space-y-2">
          <template x-for="a in analysisAlerts.items">
            <div class="card px-4 py-3 flex items-start gap-3" :class="a.is_read?'opacity-60':''">
              <span class="mt-0.5 w-2 h-2 rounded-full flex-shrink-0"
                :class="a.severity==='critical'?'bg-red-500':a.severity==='warning'?'bg-yellow-500':'bg-blue-500'"></span>
              <div class="flex-1 min-w-0">
                <p class="text-xs font-medium text-slate-300 truncate" x-text="a.title"></p>
                <p class="text-[10px] text-slate-600 mt-0.5" x-text="a.detail"></p>
                <p class="text-[10px] text-slate-700 mt-0.5" x-text="a.created_at?.replace('T',' ').slice(0,16)"></p>
              </div>
              <div class="flex gap-2 flex-shrink-0">
                <button x-show="!a.is_read" @click="markAlertRead(a)" class="text-[10px] text-slate-500 hover:text-slate-300" x-text="t('btn_read')"></button>
                <button @click="analysisSelectedItem=a.market_hash_name; analysisTab='detail'; loadItemSignals(a.market_hash_name)"
                  class="text-[10px] text-blue-400 hover:text-blue-300" x-text="t('btn_view')"></button>
              </div>
            </div>
          </template>
          <div x-show="!analysisAlerts.items?.length" class="card p-8 text-center text-slate-600 text-sm" x-text="t('no_alerts')"></div>
        </div>

        <!-- Pagination -->
        <div x-show="analysisAlerts.total>20" class="flex items-center justify-between mt-3 text-xs text-slate-600">
          <span><span x-text="t('total_records')"></span> <span class="text-slate-400" x-text="analysisAlerts.total"></span></span>
          <div class="flex gap-2">
            <button @click="loadAlerts(alertPage-1)" :disabled="alertPage<=1" class="px-3 py-1 rounded bg-slate-800 disabled:opacity-30">‹</button>
            <button @click="loadAlerts(alertPage+1)" :disabled="alertPage*20>=analysisAlerts.total" class="px-3 py-1 rounded bg-slate-800 disabled:opacity-30">›</button>
          </div>
        </div>
      </div>

      <!-- ── Sub: Spreads ── -->
      <div x-show="analysisTab==='spreads'">
        <div class="flex items-center gap-3 mb-4">
          <label class="text-xs text-slate-500" x-text="t('min_spread')"></label>
          <input type="number" x-model.number="minSpread" @change="loadSpreads(1)" min="0" step="1"
            class="w-20 px-2 py-1.5 rounded-lg text-xs font-mono" style="background:rgba(15,23,42,0.8); border:1px solid rgba(51,65,85,0.3); color:#e2e8f0" />
        </div>

        <div class="card overflow-hidden">
          <table class="w-full text-xs">
            <thead><tr class="text-[10px] text-slate-600 uppercase" style="background:rgba(15,23,42,0.5)">
              <th class="py-2 px-3 text-left" x-text="t('th_item')"></th>
              <th class="py-2 px-2 text-right">Min</th>
              <th class="py-2 px-2 text-right">Max</th>
              <th class="py-2 px-2 text-right">Spread%</th>
              <th class="py-2 px-2 text-right">#</th>
              <th class="py-2 px-2 text-left">Detail</th>
            </tr></thead>
            <tbody>
              <template x-for="s in analysisSpreads.items">
                <tr class="border-t hover:bg-slate-800/30" style="border-color:rgba(51,65,85,0.2)">
                  <td class="py-2 px-3 text-slate-300 truncate max-w-[200px] cursor-pointer"
                    @click="analysisSelectedItem=s.market_hash_name; analysisTab='detail'; loadItemSignals(s.market_hash_name)"
                    :title="s.market_hash_name" x-text="s.market_hash_name"></td>
                  <td class="py-2 px-2 text-right font-mono text-emerald-400" x-text="'¥'+s.min_price"></td>
                  <td class="py-2 px-2 text-right font-mono text-red-400" x-text="'¥'+s.max_price"></td>
                  <td class="py-2 px-2 text-right font-mono font-bold text-yellow-300" x-text="s.spread_pct+'%'"></td>
                  <td class="py-2 px-2 text-right text-slate-400" x-text="s.platform_count"></td>
                  <td class="py-2 px-2 text-[10px] text-slate-500">
                    <template x-for="p in s.platforms">
                      <span class="mr-2" x-text="p.platform+'¥'+p.sell_price"></span>
                    </template>
                  </td>
                </tr>
              </template>
              <tr x-show="!analysisSpreads.items?.length"><td colspan="6" class="py-6 text-center text-slate-600" x-text="t('no_arb_data')"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ════════════ TRACKER TAB ════════════ -->
    <div x-show="activeTab==='tracker'" class="fade-up">
      <div class="space-y-6">

        <!-- Header + Actions -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-bold text-white" x-text="t('tracker_title')"></h2>
            <p class="text-xs text-slate-600 mt-0.5" x-text="t('tracker_subtitle')"></p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button @click="trackerSnapshot()" :disabled="trackerSnapshotting"
              class="px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white disabled:opacity-40">
              <span x-text="trackerSnapshotting ? t('tracker_snapshotting') : t('tracker_snapshot')"></span>
            </button>
            <label class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-300 cursor-pointer">
              <span x-text="t('tracker_import')"></span>
              <input type="file" accept=".xlsx" class="hidden" @change="trackerImportExcel($event)">
            </label>
            <a :href="'/api/tracker/export'" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-300" x-text="t('tracker_export')"></a>
          </div>
        </div>

        <!-- Summary Cards (latest day) -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" x-show="trackerData.length > 0">
          <template x-for="card in [
            {label: t('tracker_col_income'), value: trackerData[0]?.daily_income, prefix: '¥', fmt: 'number'},
            {label: t('tracker_col_combined'), value: trackerData[0]?.combined_annual, suffix: '%', fmt: 'pct'},
            {label: t('tracker_col_rented'), value: trackerData[0]?.rented_count, fmt: 'int'},
            {label: t('tracker_col_inv_value'), value: trackerData[0]?.inventory_value, prefix: '¥', fmt: 'number'},
            {label: t('tracker_col_change'), value: trackerData[0]?.price_change, suffix: '%', fmt: 'pct'},
          ]" :key="card.label">
            <div class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/50">
              <div class="text-[11px] text-slate-500 mb-1" x-text="card.label"></div>
              <div class="text-base font-mono font-bold"
                :class="card.fmt==='pct' && card.value > 0 ? 'text-emerald-400' : card.fmt==='pct' && card.value < 0 ? 'text-red-400' : 'text-white'"
                x-text="card.value != null ? ((card.prefix||'') + (card.fmt==='pct' ? (card.value*100).toFixed(2) : card.fmt==='int' ? Math.round(card.value).toLocaleString() : Number(card.value).toLocaleString('en-US', {maximumFractionDigits:2})) + (card.suffix||'')) : '—'">
              </div>
            </div>
          </template>
        </div>

        <!-- Chart -->
        <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50">
          <div class="flex items-center gap-2 mb-3">
            <template x-for="ct in [
              {key:'combined_annual', cn:'综合年化', en:'Combined Annual'},
              {key:'daily_income', cn:'日租金', en:'Daily Income'},
              {key:'inventory_value', cn:'库存价值', en:'Inventory Value'},
              {key:'price_change', cn:'涨跌', en:'Change'},
            ]">
              <button @click="trackerChartType=ct.key; renderTrackerChart()"
                class="px-2 py-1 rounded text-xs transition-all"
                :class="trackerChartType===ct.key ? 'bg-blue-600 text-white' : 'text-slate-500 hover:text-slate-300'"
                x-text="nameLang==='cn' ? ct.cn : ct.en"></button>
            </template>
          </div>
          <canvas id="trackerChart"></canvas>
        </div>

        <!-- Monthly Summary -->
        <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50" x-show="trackerMonthly.length > 0">
          <h3 class="text-sm font-bold text-white mb-3" x-text="t('tracker_monthly_title')"></h3>
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead>
                <tr class="text-slate-500 border-b border-slate-700/50">
                  <th class="py-2 px-2 text-left" x-text="nameLang==='cn'?'月份':'Month'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'天数':'Days'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'总收入':'Income'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'服务费':'Fee'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'净租金':'Net'"></th>
                  <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'净租金年化':'Annual'"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="m in trackerMonthly" :key="m.year+'-'+m.month">
                  <tr class="border-b border-slate-700/30 hover:bg-slate-700/20">
                    <td class="py-2 px-2 text-slate-300" x-text="m.year+'-'+(m.month<10?'0':'')+m.month"></td>
                    <td class="py-2 px-2 text-right text-slate-400">
                      <span x-text="m.days"></span><span class="text-slate-600" x-show="m.is_estimated" x-text="'/'+m.days_in_month"></span>
                    </td>
                    <td class="py-2 px-2 text-right font-mono" :class="m.is_estimated?'text-slate-400 italic':'text-white'"
                      :title="m.is_estimated?(nameLang==='cn'?'预估('+m.days+'天数据→'+m.days_in_month+'天)':'Est.('+m.days+'d→'+m.days_in_month+'d)'):''">
                      <span x-text="'¥'+Number(m.is_estimated?m.est_total_income:m.total_income||0).toLocaleString('en-US',{maximumFractionDigits:0})"></span>
                      <span x-show="m.is_estimated" class="text-[9px] text-slate-500 ml-0.5">~</span>
                    </td>
                    <td class="py-2 px-2 text-right text-red-400 font-mono" :class="m.is_estimated?'italic':''">
                      <span x-text="'¥'+Number(m.is_estimated?m.est_service_fee:m.service_fee||0).toLocaleString('en-US',{maximumFractionDigits:0})"></span>
                      <span x-show="m.is_estimated" class="text-[9px] text-slate-500 ml-0.5">~</span>
                    </td>
                    <td class="py-2 px-2 text-right text-emerald-400 font-mono" :class="m.is_estimated?'italic':''">
                      <span x-text="'¥'+Number(m.is_estimated?m.est_net_rental:m.net_rental||0).toLocaleString('en-US',{maximumFractionDigits:0})"></span>
                      <span x-show="m.is_estimated" class="text-[9px] text-slate-500 ml-0.5">~</span>
                    </td>
                    <td class="py-2 px-2 text-right font-mono" :class="m.net_rental_annual>0?'text-emerald-400':'text-slate-500'" x-text="m.net_rental_annual!=null ? (m.net_rental_annual*100).toFixed(2)+'%' : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Daily Table -->
        <div class="bg-slate-800/60 rounded-xl border border-slate-700/50 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead>
                <tr class="text-slate-500 border-b border-slate-700/50 bg-slate-800/80">
                  <th class="py-2 px-2 text-left sticky left-0 bg-slate-800/80" x-text="t('tracker_col_date')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_rented')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_value')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_income')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_short')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_long')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_combined')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_per_item')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_inv_count')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_inv_value')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_change')"></th>
                  <th class="py-2 px-2 text-right" x-text="t('tracker_col_index')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in trackerData" :key="row.date">
                  <tr class="border-b border-slate-700/30 hover:bg-slate-700/20">
                    <!-- 日期 (只读) -->
                    <td class="py-1.5 px-2 text-slate-300 sticky left-0 bg-slate-900/80 font-mono" x-text="row.date"></td>

                    <!-- 出租件数 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='rented_count'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='rented_count'" x-text="row.rented_count?.toLocaleString()??'—'"></span>
                      <input x-show="row._edit==='rented_count'" class="w-16 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.rented_count??''"
                        @blur="row._edit=''; trackerEditField(row.date,'rented_count',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 出租价值 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white font-mono cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='rented_value'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='rented_value'" x-text="row.rented_value!=null?'¥'+Number(row.rented_value).toLocaleString('en-US',{maximumFractionDigits:0}):'—'"></span>
                      <input x-show="row._edit==='rented_value'" class="w-24 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.rented_value??''"
                        @blur="row._edit=''; trackerEditField(row.date,'rented_value',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 日租金 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-amber-400 font-mono cursor-default"
                      :title="nameLang==='cn'?'双击修改 (支持公式如 =2400+65)':'Dbl-click to edit (formulas like =2400+65)'"
                      @dblclick="row._edit='daily_income'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='daily_income'" x-text="row.daily_income!=null?'¥'+Number(row.daily_income).toFixed(2):'—'"></span>
                      <input x-show="row._edit==='daily_income'" class="w-24 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.daily_income??''" placeholder="=2400+65"
                        @blur="row._edit=''; trackerEditField(row.date,'daily_income',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 短租年化 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400" x-text="row.short_lease_annual!=null?(row.short_lease_annual*100).toFixed(2)+'%':'—'"></td>
                    <!-- 长租年化 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400" x-text="row.long_lease_annual!=null?(row.long_lease_annual*100).toFixed(2)+'%':'—'"></td>
                    <!-- 综合年化 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono font-bold" :class="row.combined_annual>0?'text-emerald-400':'text-slate-500'" x-text="row.combined_annual!=null?(row.combined_annual*100).toFixed(2)+'%':'—'"></td>
                    <!-- 单件/天 (只读, 派生) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400" x-text="row.income_per_item!=null?'¥'+Number(row.income_per_item).toFixed(2):'—'"></td>

                    <!-- 总库存件数 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='total_inventory'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='total_inventory'" x-text="row.total_inventory?.toLocaleString()??'—'"></span>
                      <input x-show="row._edit==='total_inventory'" class="w-16 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.total_inventory??''"
                        @blur="row._edit=''; trackerEditField(row.date,'total_inventory',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 库存价值 (可编辑) -->
                    <td class="py-1.5 px-2 text-right text-white font-mono cursor-default"
                      :title="nameLang==='cn'?'双击修改 (支持公式)':'Dbl-click to edit (formulas)'"
                      @dblclick="row._edit='inventory_value'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='inventory_value'" x-text="row.inventory_value!=null?'¥'+Number(row.inventory_value).toLocaleString('en-US',{maximumFractionDigits:0}):'—'"></span>
                      <input x-show="row._edit==='inventory_value'" class="w-28 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.inventory_value??''"
                        @blur="row._edit=''; trackerEditField(row.date,'inventory_value',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 涨跌 (双击编辑成本基准) -->
                    <td class="py-1.5 px-2 text-right font-mono relative cursor-default"
                      :class="row.price_change>0?'text-emerald-400':row.price_change<0?'text-red-400':'text-slate-500'"
                      :title="row.cost_basis ? ((nameLang==='cn'?'成本: ¥':'Cost: ¥') + Number(row.cost_basis).toLocaleString() + '\n' + (nameLang==='cn'?'双击修改成本':'Dbl-click to edit cost')) : (nameLang==='cn'?'双击设置成本':'Dbl-click to set cost')"
                      @dblclick="row._edit='cost_basis'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='cost_basis'" x-text="row.price_change!=null?(row.price_change*100).toFixed(2)+'%':'—'"></span>
                      <input x-show="row._edit==='cost_basis'" class="w-24 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.cost_basis??''" placeholder="成本"
                        @blur="row._edit=''; trackerEditField(row.date,'cost_basis',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>

                    <!-- 大盘指数 (双击编辑) -->
                    <td class="py-1.5 px-2 text-right font-mono text-slate-400 cursor-default"
                      :title="nameLang==='cn'?'双击修改':'Dbl-click to edit'"
                      @dblclick="row._edit='steamdt_index'; $nextTick(()=>$el.querySelector('input')?.focus())">
                      <span x-show="row._edit!=='steamdt_index'" x-text="row.steamdt_index!=null?Number(row.steamdt_index).toFixed(2):'—'"></span>
                      <input x-show="row._edit==='steamdt_index'" class="w-16 bg-slate-700 rounded text-right text-xs font-mono text-white border border-slate-500 outline-none px-1 py-0.5"
                        :value="row.steamdt_index??''"
                        @blur="row._edit=''; trackerEditField(row.date,'steamdt_index',$event.target.value)"
                        @keydown.enter="$event.target.blur()" @keydown.escape="row._edit=''">
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

    <!-- ════════════ CHANGELOG TAB ════════════ -->
    <div x-show="activeTab==='changelog'" class="fade-up">

      <!-- Header -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <h2 class="text-lg font-bold text-white" x-text="t('changelog_title')"></h2>
          <p class="text-xs text-slate-600 mt-0.5" x-text="t('changelog_subtitle')"></p>
        </div>
        <div class="text-xs text-slate-600">
          <span x-text="t('current_version')"></span>
          <span class="text-blue-400 font-mono font-bold ml-1">v0.5.1</span>
        </div>
      </div>

      <!-- Timeline -->
      <div class="space-y-6">
        <template x-for="release in changelogData" :key="release.version">
          <div class="card p-0 overflow-hidden">
            <!-- Version header -->
            <div class="px-5 py-4 flex items-center justify-between"
              style="border-bottom: 1px solid rgba(51,65,85,0.2)"
              :style="release.major ? 'background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.05))' : ''">
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold font-mono"
                  :class="release.major ? 'bg-blue-500/15 text-blue-400 ring-1 ring-blue-500/20' : 'bg-slate-700/50 text-slate-400'"
                  x-text="'v' + release.version"></span>
                <span class="text-sm font-semibold text-white" x-text="nameLang==='cn' ? release.title_cn : release.title_en"></span>
              </div>
              <span class="text-[11px] text-slate-600 font-mono" x-text="release.date"></span>
            </div>
            <!-- Changes list -->
            <div class="px-5 py-4 space-y-4">
              <!-- Added / 新增 -->
              <template x-if="release.added?.length">
                <div>
                  <p class="text-[10px] uppercase tracking-widest font-semibold text-emerald-500 mb-2" x-text="t('cl_added')"></p>
                  <ul class="space-y-1.5">
                    <template x-for="item in release.added">
                      <li class="flex items-start gap-2 text-xs">
                        <span class="text-emerald-500 mt-0.5 flex-shrink-0">+</span>
                        <span class="text-slate-400" x-text="nameLang==='cn' ? item[0] : item[1]"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Fixed / 修复 -->
              <template x-if="release.fixed?.length">
                <div>
                  <p class="text-[10px] uppercase tracking-widest font-semibold text-amber-500 mb-2" x-text="t('cl_fixed')"></p>
                  <ul class="space-y-1.5">
                    <template x-for="item in release.fixed">
                      <li class="flex items-start gap-2 text-xs">
                        <span class="text-amber-500 mt-0.5 flex-shrink-0">~</span>
                        <span class="text-slate-400" x-text="nameLang==='cn' ? item[0] : item[1]"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Changed / 变更 -->
              <template x-if="release.changed?.length">
                <div>
                  <p class="text-[10px] uppercase tracking-widest font-semibold text-blue-500 mb-2" x-text="t('cl_changed')"></p>
                  <ul class="space-y-1.5">
                    <template x-for="item in release.changed">
                      <li class="flex items-start gap-2 text-xs">
                        <span class="text-blue-500 mt-0.5 flex-shrink-0">△</span>
                        <span class="text-slate-400" x-text="nameLang==='cn' ? item[0] : item[1]"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <!-- Commits -->
              <div x-show="release.commits?.length" style="border-top: 1px solid rgba(51,65,85,0.2); padding-top: 12px;">
                <details class="group">
                  <summary class="text-[10px] uppercase tracking-widest text-slate-700 cursor-pointer hover:text-slate-500 transition-colors select-none">
                    <span x-text="t('cl_commits')"></span> (<span x-text="release.commits?.length"></span>)
                  </summary>
                  <ul class="mt-2 space-y-1">
                    <template x-for="c in release.commits">
                      <li class="flex items-start gap-2 text-[11px] font-mono">
                        <span class="text-slate-700 flex-shrink-0" x-text="c.hash"></span>
                        <span class="text-slate-600" x-text="c.msg"></span>
                        <span class="text-slate-800 ml-auto flex-shrink-0" x-text="c.date"></span>
                      </li>
                    </template>
                  </ul>
                </details>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ════════════ INVENTORY TAB ════════════ -->
    <div x-show="activeTab==='inventory'">

      <!-- Mini strip -->
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-2 px-1 text-[10px] text-slate-700">
        <span x-show="overview.price_updated_at">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>
          <span x-text="t('ts_price')"></span>
          <span class="text-slate-500 font-mono" x-text="fmtUtcStr(overview.price_updated_at)"></span>
        </span>
        <span x-show="lastImportAt">
          <span class="text-slate-800">|</span>
          <span x-text="t('ts_sync')"></span>
          <span class="text-slate-500 font-mono" x-text="lastImportAt"></span>
        </span>
        <span class="text-slate-500/60 ml-auto">PT</span>
      </div>
      <!-- Quick filter chips -->
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <button @click="filters.pricedFilter='unpriced'; filters.status=''; page=1; loadItems()"
          class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all"
          :class="filters.pricedFilter==='unpriced' ? 'bg-amber-500/20 text-amber-400 ring-1 ring-amber-500/30' : 'text-slate-500 hover:text-slate-300 bg-slate-800/50'"
          x-text="t('btn_unpriced')"></button>
        <button @click="filters.status='rented_out'; filters.pricedFilter=''; page=1; loadItems()"
          class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all"
          :class="filters.status==='rented_out' ? 'bg-green-500/20 text-green-400 ring-1 ring-green-500/30' : 'text-slate-500 hover:text-slate-300 bg-slate-800/50'"
          x-text="t('status_rented')"></button>
        <button @click="filters.status=''; filters.pricedFilter=''; page=1; loadItems()"
          class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-all"
          :class="!filters.status && !filters.pricedFilter ? 'bg-blue-500/20 text-blue-400 ring-1 ring-blue-500/30' : 'text-slate-500 hover:text-slate-300 bg-slate-800/50'"
          x-text="t('all_status')"></button>
      </div>

      <!-- Filter bar -->
      <div class="card px-4 py-3 mb-4">
        <div class="flex flex-wrap items-center gap-2">

          <!-- Search -->
          <div class="relative flex-1 min-w-[180px]">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 pointer-events-none"
              style="color:#475569" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" x-model="filters.search"
              @input.debounce.400ms="page=1; loadItems()"
              :placeholder="t('search_placeholder')"
              class="w-full pl-9 pr-3 py-2 rounded-xl text-sm border" />
          </div>

          <!-- Status -->
          <select x-model="filters.status" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border" style="min-width: 108px">
            <option value="" x-text="t('all_status')"></option>
            <option value="rented_out" x-text="t('status_rented')"></option>
            <option value="in_steam" x-text="t('status_steam')"></option>
            <option value="in_storage" x-text="t('status_storage')"></option>
          </select>

          <!-- Category filter -->
          <select x-model="filters.category" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border" style="min-width: 100px">
            <option value="" x-text="t('all_types')"></option>
            <optgroup :label="nameLang==='cn'?'近战':'Melee'">
              <option value="knife" x-text="t('cat_knife')"></option>
              <option value="glove" x-text="t('cat_glove')"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'枪械':'Weapons'">
              <option value="pistol" x-text="t('cat_pistol')"></option>
              <option value="rifle" x-text="t('cat_rifle')"></option>
              <option value="sniper" x-text="t('cat_sniper')"></option>
              <option value="smg" x-text="t('cat_smg')"></option>
              <option value="shotgun" x-text="t('cat_shotgun')"></option>
              <option value="mg" x-text="t('cat_mg')"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'饰品':'Cosmetics'">
              <option value="sticker" x-text="t('cat_sticker')"></option>
              <option value="patch" x-text="nameLang==='cn'?'布章':'Patch'"></option>
              <option value="graffiti" x-text="nameLang==='cn'?'涂鸦':'Graffiti'"></option>
              <option value="charm" x-text="nameLang==='cn'?'挂件':'Charm'"></option>
              <option value="musickit" x-text="nameLang==='cn'?'音乐盒':'Music Kit'"></option>
              <option value="agent" x-text="nameLang==='cn'?'特工':'Agent'"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'容器':'Containers'">
              <option value="case" x-text="t('cat_case')"></option>
              <option value="key" x-text="nameLang==='cn'?'钥匙/通行证':'Key/Pass'"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'品质':'Quality'">
              <option value="stattrak">StatTrak™</option>
              <option value="souvenir" x-text="nameLang==='cn'?'纪念品':'Souvenir'"></option>
            </optgroup>
            <optgroup :label="nameLang==='cn'?'磨损':'Wear'">
              <option value="fn" x-text="nameLang==='cn'?'崭新出厂 FN':'Factory New'"></option>
              <option value="mw" x-text="nameLang==='cn'?'略有磨损 MW':'Minimal Wear'"></option>
              <option value="ft" x-text="nameLang==='cn'?'久经沙场 FT':'Field-Tested'"></option>
              <option value="ww" x-text="nameLang==='cn'?'破损不堪 WW':'Well-Worn'"></option>
              <option value="bs" x-text="nameLang==='cn'?'战痕累累 BS':'Battle-Scarred'"></option>
            </optgroup>
          </select>

          <!-- Priced filter -->
          <select x-model="filters.pricedFilter" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border" style="min-width: 96px">
            <option value="" x-text="t('all_filter')"></option>
            <option value="priced" x-text="t('priced')"></option>
            <option value="unpriced" x-text="t('unpriced')"></option>
          </select>

          <!-- Show sold toggle -->
          <label class="pill-toggle" :class="showSold ? 'active-slate' : ''"
            @click="showSold=!showSold; page=1; loadItems()">
            <span x-text="t('show_sold')"></span>
            <div class="relative toggle-track" :style="showSold ? 'background:#475569' : 'background:#1e293b'">
              <div class="toggle-thumb" :style="showSold ? 'transform:translateX(12px)' : ''"></div>
            </div>
          </label>

          <!-- Dual price toggle -->
          <label class="pill-toggle" :class="dualPrice ? 'active-blue' : ''"
            @click="dualPrice=!dualPrice">
            <span x-text="t('dual_price')"></span>
            <div class="relative toggle-track" :style="dualPrice ? 'background:#1d4ed8' : 'background:#1e293b'">
              <div class="toggle-thumb" :style="dualPrice ? 'transform:translateX(12px)' : ''"></div>
            </div>
          </label>

          <!-- Cost sort shortcut -->
          <button @click="setSort('effective_price')"
            class="pill-toggle" :class="sortBy==='effective_price' ? 'active-blue' : ''">
            <span x-text="t('cost_sort')"></span> <span x-text="sortBy==='effective_price'?(sortOrder==='desc'?'↓':'↑'):'↕'"></span>
          </button>

          <!-- Page size -->
          <select x-model.number="pageSize" @change="page=1; loadItems()"
            class="py-2 pl-3 rounded-xl text-sm border ml-auto" style="width: 70px">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
      </div>

      <!-- Table -->
      <div class="card overflow-hidden">
        <div class="tbl-wrap">
          <table class="w-full text-xs" style="border-collapse: separate; border-spacing: 0;">
            <thead>
              <tr style="border-bottom: 1px solid rgba(51,65,85,0.3);">
                <th class="py-3 px-4 text-left font-normal text-slate-700 uppercase tracking-wider w-8">#</th>
                <th class="py-3 px-4 text-left font-normal text-slate-700 uppercase tracking-wider" x-text="t('th_item')"></th>
                <th class="py-3 px-3 text-left font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('status')">
                  <span x-text="t('th_status')"></span> <span x-text="sortIcon('status')"></span>
                </th>
                <th class="py-3 px-3 text-right font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('abrade')">
                  <span x-text="t('th_abrade')"></span> <span x-text="sortIcon('abrade')"></span>
                </th>
                <template x-if="!dualPrice">
                  <th class="py-3 px-3 text-right font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('effective_price')">
                    <span x-text="t('th_cost')"></span> <span x-text="sortIcon('effective_price')"></span>
                  </th>
                </template>
                <template x-if="dualPrice">
                  <th class="py-3 px-3 text-right font-normal uppercase tracking-wider" style="color:#475569" x-text="t('th_auto_price')"></th>
                </template>
                <template x-if="dualPrice">
                  <th class="py-3 px-3 text-right font-normal uppercase tracking-wider" style="color:rgba(202,138,4,0.7)" x-text="t('th_manual_price')"></th>
                </template>
                <th class="py-3 px-3 text-right font-normal uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" style="color:#047857" @click="setSort('current_price')">
                  <span x-text="t('th_market_price')"></span> <span x-text="sortIcon('current_price')"></span>
                </th>
                <th class="py-3 px-2 text-right font-normal uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" style="color:#475569" @click="setSort('pnl')">
                  <span x-text="t('th_pnl')"></span> <span x-text="sortIcon('pnl')"></span>
                </th>
                <th class="py-3 px-2 text-right font-normal uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" style="color:#475569" @click="setSort('pnl_pct')">
                  <span x-text="t('th_pnl_pct')"></span> <span x-text="sortIcon('pnl_pct')"></span>
                </th>
                <th class="py-3 px-3 text-right font-normal text-slate-700 uppercase tracking-wider hover:text-slate-400 cursor-pointer select-none transition-colors" @click="setSort('purchase_date')">
                  <span x-text="t('th_date')"></span> <span x-text="sortIcon('purchase_date')"></span>
                </th>
                <th class="py-3 px-3 text-left font-normal text-slate-700 uppercase tracking-wider" x-text="t('th_platform')"></th>
                <th class="py-3 px-4 w-10"></th>
              </tr>
            </thead>
            <tbody>
              <!-- Loading -->
              <template x-if="loading">
                <tr>
                  <td :colspan="dualPrice ? 12 : 11" class="py-24 text-center" style="color:#334155">
                    <div class="flex flex-col items-center gap-3">
                      <div class="w-6 h-6 rounded-full border-2 border-t-blue-500 animate-spin" style="border-color: rgba(51,65,85,0.4); border-top-color: #3b82f6"></div>
                      <span class="text-xs" x-text="t('loading')"></span>
                    </div>
                  </td>
                </tr>
              </template>

              <!-- Empty -->
              <template x-if="!loading && items.length === 0">
                <tr>
                  <td :colspan="dualPrice ? 12 : 11" class="py-24 text-center text-xs" style="color:#334155"
                    x-text="t('no_match')">
                  </td>
                </tr>
              </template>

              <!-- Rows -->
              <template x-for="(item, idx) in items" :key="item.id">
                <tr class="tbl-row" @click="openPanel(item)">
                  <td class="py-2.5 px-4 font-mono" style="color:#334155" x-text="(page-1)*pageSize+idx+1"></td>

                  <!-- Item name + icon -->
                  <td class="py-2.5 px-4">
                    <div class="flex items-center gap-2.5">

        t(key) {

        toast: { msg: '', type: 'success' },

        // ── Computed page numbers ──────────────────────────────────────
        get pageNums() {
          const total = Math.max(1, Math.ceil(this.total / this.pageSize));
          const cur = this.page;
          if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
          if (cur <= 4) return [1, 2, 3, 4, 5, '...', total];
          if (cur >= total - 3) return [1, '...', total-4, total-3, total-2, total-1, total];
          return [1, '...', cur-1, cur, cur+1, '...', total];
        },

        // ── Init ──────────────────────────────────────────────────────
        async init() {
          await this.loadAll();
          // 加载登录状态
          this._loadAuthState();
          // 检查 token 状态
          this._checkToken();
          // 并行加载初始状态（market status + alerts），不阻塞主加载
          Promise.all([
            fetch('/api/youpin/market/status').then(r => r.ok ? r.json() : null).catch(() => null),
            fetch('/api/analysis/alerts?page_size=1&unread_only=true').then(r => r.ok ? r.json() : null).catch(() => null),
          ]).then(([marketStatus, alertData]) => {
            if (marketStatus?.status === 'running') {
              this.refreshing = true;
              this.refreshProgress = marketStatus.progress;
              this._startRefreshPoll();
            }
            if (alertData) this.unreadAlertCount = alertData.total || 0;
          });
          // Lazy-load tracker; re-render chart on every tab switch (canvas needs visible DOM)
          this.$watch('activeTab', (tab) => {
            if (tab === 'tracker' && this.trackerData.length === 0) this.loadTracker();
          });
          // 持久化用户偏好到 localStorage
          this.$watch('nameLang', v => localStorage.setItem('nameLang', v));
          this.$watch('memberLevel', v => localStorage.setItem('memberLevel', v));
          this.$watch('youpinMembership', v => localStorage.setItem('youpinMembership', v));
          // Apply saved theme
          if (this.theme === 'light') document.documentElement.classList.add('light');
        },

        async _checkToken() {
          try {
            const r = await fetch('/api/youpin/token/status');
            if (r.ok) {
              const s = await r.json();
              this.tokenExpired = !s.valid;
              if (s.valid && s.nickname) this.authState.nickname = s.nickname;
              // 同步会员等级 → 自动开启大会员开关
              if (s.valid && s.member_level >= 2) {
                this.youpinMembership = true;
                localStorage.setItem('youpinMembership', 'true');
              }
            }
          } catch (e) { console.warn('Token check failed:', e.message); }
        },

        async _loadAuthState() {
          try {
            const r = await fetch('/api/youpin/auth/state');
            if (r.ok) {
              this.authState = await r.json();
              // 自动根据会员等级设置大会员开关（≥2 为大会员/黑金大会员）
              if (this.authState.member_level >= 2) {
                this.youpinMembership = true;
                localStorage.setItem('youpinMembership', 'true');
              }
            }
          } catch (e) { console.warn('Auth state load failed:', e.message); }
        },

        async sendSmsCode() {
          if (!this.loginModal.phone) return this.showToast('请输入手机号', 'error');
          this.loginModal.smsSending = true;
          try {
            const r = await fetch('/api/youpin/auth/send-sms', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: this.loginModal.phone }),
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.detail || '发送失败');
            this.loginModal.sessionId = d.session_id;
            this.showToast('验证码已发送');
            // 60秒倒计时
            this.loginModal.cooldown = 60;
            const timer = setInterval(() => {
              this.loginModal.cooldown--;
              if (this.loginModal.cooldown <= 0) clearInterval(timer);
            }, 1000);
          } catch (e) {
            const msg = e.message || '';
            if (msg.includes('5050') || msg.includes('更新') || msg.includes('版本')) {
              this.showToast('悠悠有品 API 限制了第三方 SMS 登录。请在悠悠 App 中登录后，将 Token 填入 .env 文件的 YOUPIN_TOKEN 字段，或使用下方手动输入 Token 功能。', 'error');
            } else {
              this.showToast('发送失败：' + msg, 'error');
            }
          }
          finally { this.loginModal.smsSending = false; }
        },

        async applyManualToken() {
          const token = (this.loginModal.manualToken || '').trim();
          if (!token) return;
          try {
            const r = await fetch('/api/youpin/auth/apply-token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token }),
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.detail || 'Token 无效');
            this.showToast('Token 应用成功' + (d.nickname ? '：' + d.nickname : ''));
            this.loginModal.show = false;
            this.tokenExpired = false;
            await this._loadAuthState();
          } catch (e) {
            this.showToast('Token 无效：' + e.message, 'error');
          }
        },

        async doSmsLogin() {
          if (!this.loginModal.code || !this.loginModal.sessionId) return;
          this.loginModal.logging = true;
          try {
            const r = await fetch('/api/youpin/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                phone: this.loginModal.phone,
                code: this.loginModal.code,
                session_id: this.loginModal.sessionId,
              }),
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.detail || '登录失败');
            this.showToast('登录成功：' + (d.nickname || ''));
            this.loginModal.show = false;
            this.tokenExpired = false;
            await this._loadAuthState();
          } catch (e) {
            this.showToast('登录失败：' + e.message, 'error');
          }
          finally { this.loginModal.logging = false; }
        },

        // ── 批量操作 ──────────────────────────────────────────────────
        toggleSelectItem(id) {
          const idx = this.selectedItems.indexOf(id);
          if (idx >= 0) this.selectedItems.splice(idx, 1);
          else this.selectedItems.push(id);
        },

        toggleSelectAll(items, key = 'commodityId') {
          const ids = items.map(i => i[key]).filter(Boolean);
          if (ids.every(id => this.selectedItems.includes(id))) {
            this.selectedItems = this.selectedItems.filter(id => !ids.includes(id));
          } else {
            const set = new Set(this.selectedItems);
            ids.forEach(id => set.add(id));
            this.selectedItems = [...set];
          }
        },

          if (!this.selectedItems.length || !confirm(`确认下架 ${this.selectedItems.length} 件物品？`)) return;
          try {
            const r = await fetch('/api/listing/batch-delist', {
              method: 'POST',

            this.showToast(`成功下架 ${this.selectedItems.length} 件（YouPin API 约需 30 秒更新库存，再刷新待上架）`);

        async loadTracker() {

          try {

              fetch('/api/tracker/daily'),
              fetch('/api/tracker/monthly?year=' + new Date().getFullYear()),

        // 解析公式：支持 =3500+500 等基础运算
        parseFormula(input) {
          const s = String(input).trim();
          if (s.startsWith('=')) {
            const expr = s.slice(1);
            // 只允许数字、运算符、小数点、括号、空格
            if (!/^[\d+\-*/().e\s]+$/i.test(expr)) return NaN;
            try { return Function('"use strict"; return (' + expr + ')')(); }
            catch { return NaN; }
          }
          return parseFloat(s);
        },

        async trackerEditField(date, field, rawValue) {
          // 空字符串 → null（清除字段），否则解析公式
          const trimmed = (typeof rawValue === 'string') ? rawValue.trim() : rawValue;
          const value = (trimmed === '' || trimmed === null || trimmed === undefined)
            ? null
            : (typeof trimmed === 'string') ? this.parseFormula(trimmed) : trimmed;
          if (value !== null && isNaN(value)) {
            this.showToast('公式错误 / Invalid formula', 'error'); return;
          }
          try {
            const r = await fetch('/api/tracker/' + date, {
              method: 'PATCH',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ [field]: value }),
            });
            if (!r.ok) throw new Error('Update failed');
            // 用后端返回的完整行更新（含重算的派生字段）
            const updated = await r.json();
            const row = this.trackerData.find(d => d.date === date);
            if (row) Object.assign(row, updated);
          } catch (e) {
            this.showToast(e.message, 'error');
          }
        },

          this.trackerSnapshotting = true;
          try {
            const r = await fetch('/api/tracker/snapshot?is_vip=' + this.youpinMembership, { method: 'POST' });

            if (!r.ok) throw new Error(d.detail || 'Snapshot failed');
            this.showToast(this.nameLang==='cn'?'今日数据已刷新':'Today refreshed', 'success');
            await this.loadTracker();
          } catch (e) {
            this.showToast(e.message, 'error');
          } finally {
            this.trackerSnapshotting = false;
          }
        },

          try {
