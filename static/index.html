          <span class="inline-block w-1.5 h-1.5 rounded-full bg-blue-500 mr-1"></span>
          <span x-text="t('ts_signal')"></span>
          <span class="text-slate-500 font-mono" x-text="fmtDate(ao.signal_date)"></span>
        </span>
        <span x-show="ao.collector">
          <span class="text-slate-800">|</span>
          <span x-text="t('ts_collector')"></span>
          <span class="font-mono" :class="ao.collector?.status==='running' ? 'text-blue-400' : 'text-slate-500'"
            x-text="ao.collector?.status==='running' ? t('ts_running') : (ao.collector?.last_run ? fmtMinute(ao.collector.last_run.replace(/[-T:]/g,'').slice(0,12)) : '—')"></span>
        </span>
        <span x-show="overview.price_updated_at">
          <span class="text-slate-800">|</span>
          <span x-text="t('ts_price')"></span>
          <span class="text-slate-500 font-mono" x-text="fmtUtcStr(overview.price_updated_at)"></span>
        </span>
        <span class="text-slate-500/60 ml-auto">PT</span>
      </div>

      <!-- Sub-tabs -->
      <div class="flex gap-1 mb-4">
        <template x-for="tab in [{k:'overview',l:'analysis_overview'},{k:'detail',l:'analysis_detail'},{k:'alerts',l:'analysis_alerts'},{k:'spreads',l:'analysis_spreads'}]">
          <button @click="analysisTab=tab.k; loadAnalysisSubTab(tab.k)"
            class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all"
            :class="analysisTab===tab.k ? 'bg-slate-700 text-white' : 'text-slate-500 hover:text-slate-300'"
            x-text="t(tab.l)"></button>
        </template>
      </div>

      <!-- ── Sub: Overview ── -->
      <div x-show="analysisTab==='overview'">
        <!-- Stat cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
          <div class="card p-4 cursor-pointer" @click="analysisTab='alerts'; loadAnalysisSubTab('alerts')">
            <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-1" x-text="t('unread_alerts')"></p>
            <p class="text-2xl font-bold" :class="(ao.unread_alerts||0)>0?'text-red-400':'text-slate-400'" x-text="ao.unread_alerts||0"></p>
          </div>
          <div class="card p-4">
            <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-1" x-text="t('avg_sell_score')"></p>
            <p class="text-2xl font-bold" :class="scoreColor(ao.avg_sell_score)" x-text="ao.avg_sell_score!==null?ao.avg_sell_score:'—'"></p>
            <p class="text-[10px] mt-1" :class="scoreColor(ao.avg_sell_score)" x-text="scoreLabel(ao.avg_sell_score)"></p>
          </div>
          <div class="card p-4">
            <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-1" x-text="t('avg_momentum_30')"></p>
            <p class="text-2xl font-bold" :class="pnlClass(ao.avg_momentum_30)" x-text="ao.avg_momentum_30!==null?(ao.avg_momentum_30>0?'+':'')+ao.avg_momentum_30+'%':'—'"></p>
          </div>
          <div class="card p-4">
            <p class="text-[10px] text-slate-600 uppercase tracking-widest mb-1" x-text="t('data_status')"></p>
            <p class="text-xs text-slate-400 mt-1" x-text="ao.collector?.status==='running'?t('collecting'):ao.collector?.last_run?t('last_run')+': '+ao.collector.last_run.slice(5,16):t('not_started')"></p>
            <p class="text-[10px] text-slate-600 mt-0.5" x-text="ao.signal_date?t('signal_date')+': '+ao.signal_date:t('no_signal')"></p>
          </div>
        </div>

        <!-- Sell Score Distribution (clickable bars) -->
        <div class="card p-4 mb-5">
          <p class="text-[11px] text-slate-500 mb-3 font-medium"><span x-text="t('score_dist_title')"></span> <span class="text-slate-700">— <span x-text="t('score_dist_hint')"></span></span></p>
          <div class="flex items-end gap-1.5 h-20">
            <template x-for="(v,i) in (ao.score_distribution||[0,0,0,0,0])">
              <div class="flex-1 flex flex-col items-center gap-1 cursor-pointer"
                @click="openScoreBucket(i)">
                <span class="text-[10px] font-mono text-slate-400" x-text="v"></span>
                <div class="w-full rounded-t transition-all duration-500 hover:opacity-80"
                  :style="'height:'+Math.max(4, v/Math.max(1,...(ao.score_distribution||[1]))*60)+'px'"
                  :class="['bg-emerald-500/60','bg-slate-500/60','bg-yellow-500/60','bg-orange-500/60','bg-red-500/60'][i]"></div>
                <span class="text-[9px] text-slate-600" x-text="[t('score_hold'),t('score_neutral'),t('score_consider'),t('score_strong'),t('score_urgent')][i]"></span>
              </div>
            </template>
          </div>
          <!-- Expanded bucket list -->
          <div x-show="scoreBucket.show" x-cloak class="mt-3 border-t pt-3" style="border-color:rgba(51,65,85,0.3)">
            <div class="flex items-center justify-between mb-2">
              <p class="text-[11px] text-slate-400" x-text="scoreBucket.label+' (评分 '+scoreBucket.min+'~'+scoreBucket.max+')'"></p>
              <button @click="scoreBucket.show=false" class="text-[10px] text-slate-600 hover:text-slate-400">×</button>
            </div>
            <div class="space-y-1 max-h-48 overflow-y-auto">
              <template x-for="s in scoreBucket.items">
                <div class="flex items-center justify-between px-2 py-1.5 rounded hover:bg-slate-800/30 cursor-pointer"
                  @click="analysisTab='detail'; analysisSelectedItem=s.market_hash_name; loadItemSignals(s.market_hash_name)">
                  <span class="text-xs truncate max-w-[250px]" :style="rarityStyle(s.market_hash_name)" x-text="s.market_hash_name"></span>
                  <span class="text-xs font-mono ml-2 flex-shrink-0" :class="scoreColor(s.sell_score)" x-text="s.sell_score"></span>
                </div>
              </template>
              <div x-show="!scoreBucket.items?.length" class="text-[10px] text-slate-700 text-center py-2">—</div>
            </div>
          </div>
        </div>

        <!-- Top 10 + Category Trends -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- Top 10 Sell Signals -->
          <div class="card overflow-hidden">
            <div class="px-4 py-3 border-b" style="border-color:rgba(51,65,85,0.3)">
              <p class="text-[11px] text-slate-500 font-medium" x-text="t('top10_sell')"></p>
            </div>
            <table class="w-full text-xs">
              <thead><tr class="text-[10px] text-slate-600 uppercase" style="background:rgba(15,23,42,0.5)">
                <th class="py-2 px-3 text-left" x-text="t('th_item')"></th>
                <th class="py-2 px-2 text-right">Score</th>
                <th class="py-2 px-2 text-right">RSI</th>
                <th class="py-2 px-2 text-right">30D</th>
                <th class="py-2 px-2 text-right">ATH%</th>
              </tr></thead>
              <tbody>
                <template x-for="s in (ao.top_sell||[])">
                  <tr class="border-t cursor-pointer hover:bg-slate-800/30" style="border-color:rgba(51,65,85,0.2)"
                    @click="analysisTab='detail'; analysisSelectedItem=s.market_hash_name; loadItemSignals(s.market_hash_name)">
                    <td class="py-2 px-3">
                      <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded overflow-hidden flex-shrink-0" style="background:rgba(20,30,48,0.8)">
                          <img :src="iconUrl(s.icon_url)" class="w-full h-full object-cover" @error="$el.src='/static/placeholder.svg'" loading="lazy" x-show="s.icon_url" />
                        </div>
                        <div class="min-w-0">
                          <p class="font-medium truncate max-w-[160px]" :style="rarityStyle(s.market_hash_name)" :title="s.market_hash_name"
                            x-text="nameLang==='cn' ? (s.name||s.market_hash_name) : s.market_hash_name"></p>
                          <p class="text-[10px] truncate max-w-[160px]" style="color:#475569"
                            x-text="nameLang==='cn' ? s.market_hash_name : (s.name||'')"></p>
                        </div>
                      </div>
                    </td>
                    <td class="py-2 px-2 text-right font-mono font-bold" :class="scoreColor(s.sell_score)" x-text="s.sell_score"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="s.rsi_14>70?'text-red-400':s.rsi_14<30?'text-emerald-400':'text-slate-400'" x-text="s.rsi_14??'—'"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="pnlClass(s.momentum_30)" x-text="s.momentum_30!==null?(s.momentum_30>0?'+':'')+s.momentum_30+'%':'—'"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="s.ath_pct>90?'text-yellow-300':'text-slate-400'" x-text="s.ath_pct?s.ath_pct+'%':'—'"></td>
                  </tr>
                </template>
                <tr x-show="!ao.top_sell?.length"><td colspan="5" class="py-6 text-center text-slate-600" x-text="t('no_signal_hint')"></td></tr>
              </tbody>
            </table>
          </div>

          <!-- Category Trends -->
          <div class="card overflow-hidden">
            <div class="px-4 py-3 border-b" style="border-color:rgba(51,65,85,0.3)">
              <p class="text-[11px] text-slate-500 font-medium" x-text="t('category_trends')"></p>
            </div>
            <table class="w-full text-xs">
              <thead><tr class="text-[10px] text-slate-600 uppercase" style="background:rgba(15,23,42,0.5)">
                <th class="py-2 px-3 text-left" x-text="nameLang==='cn'?'类别':'Category'"></th>
                <th class="py-2 px-2 text-right" x-text="nameLang==='cn'?'数量':'Count'"></th>
                <th class="py-2 px-2 text-right">7D</th>
                <th class="py-2 px-2 text-right">30D</th>
                <th class="py-2 px-2 text-right">RSI</th>
              </tr></thead>
              <tbody>
                <template x-for="c in (ao.category_trends||[])">
                  <tr class="border-t" style="border-color:rgba(51,65,85,0.2)">
                    <td class="py-2 px-3 font-medium text-slate-300" x-text="catLabel(c.category)"></td>
                    <td class="py-2 px-2 text-right font-mono text-slate-400" x-text="c.count"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="pnlClass(c.avg_momentum_7)" x-text="c.avg_momentum_7!==null?(c.avg_momentum_7>0?'+':'')+c.avg_momentum_7+'%':'—'"></td>
                    <td class="py-2 px-2 text-right font-mono" :class="pnlClass(c.avg_momentum_30)" x-text="c.avg_momentum_30!==null?(c.avg_momentum_30>0?'+':'')+c.avg_momentum_30+'%':'—'"></td>
                    <td class="py-2 px-2 text-right font-mono text-slate-400" x-text="c.avg_rsi??'—'"></td>
                  </tr>
                </template>
                <tr x-show="!ao.category_trends?.length"><td colspan="5" class="py-6 text-center text-slate-600">—</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="flex gap-3 mt-4">
          <button @click="triggerBackfill()" :disabled="backfillRunning"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50">
            <span x-show="!backfillRunning" x-text="t('btn_backfill')"></span>
            <span x-show="backfillRunning" x-cloak x-text="t('backfilling')+' '+backfillProgress"></span>
          </button>
          <button @click="triggerComputeNow()" :disabled="computingSignals"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-white disabled:opacity-50">
            <span x-show="!computingSignals" x-text="t('btn_compute')"></span>
            <span x-show="computingSignals" x-cloak x-text="t('computing')"></span>
          </button>
          <button @click="collectNow()" :disabled="ao.collector?.status==='running'"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-white disabled:opacity-50">
            <span x-text="ao.collector?.status==='running'?t('collecting'):t('btn_collect')"></span>
          </button>
          <button @click="triggerCsqaqSync()"
            class="px-4 py-2 rounded-lg text-xs font-medium bg-teal-700 hover:bg-teal-600 text-white">
            <span x-text="nameLang==='cn'?'CSQAQ 同步':'CSQAQ Sync'"></span>
          </button>
        </div>
      </div>

      <!-- ── Sub: Item Detail ── -->
      <div x-show="analysisTab==='detail'">
        <!-- Search bar -->
        <div class="flex gap-3 mb-4">
          <div class="relative flex-1">
            <input type="text" x-model="analysisSearch" @input.debounce.300ms="searchAnalysisItems()"
              :placeholder="t('search_item_hint')" class="w-full px-4 py-2.5 rounded-xl text-sm text-white placeholder-slate-600"
              style="background:rgba(15,23,42,0.8); border:1px solid rgba(51,65,85,0.3)" />
            <div x-show="analysisSearchResults.length>0" x-cloak
              class="absolute z-50 left-0 right-0 top-full mt-1 rounded-xl overflow-hidden shadow-xl max-h-60 overflow-y-auto"
              style="background:rgba(15,23,42,0.95); border:1px solid rgba(51,65,85,0.4)">
              <template x-for="r in analysisSearchResults">
                <div @click="analysisSelectedItem=r.market_hash_name; analysisSearch=r.market_hash_name; analysisSearchResults=[]; loadItemSignals(r.market_hash_name)"
                  class="px-4 py-2 text-xs text-slate-300 hover:bg-slate-700/50 cursor-pointer truncate" x-text="r.market_hash_name"></div>
              </template>
            </div>
          </div>
        </div>

        <template x-if="itemSignals">
          <div>
            <!-- Price Chart -->
            <div class="card p-4 mb-4">
              <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-lg overflow-hidden flex-shrink-0" style="background:rgba(20,30,48,0.8)" x-show="itemSignals.icon_url">
                    <img :src="iconUrl(itemSignals.icon_url)" class="w-full h-full object-cover" @error="$el.src='/static/placeholder.svg'" loading="lazy" />
                  </div>
                  <div>
                    <p class="text-sm font-medium" :style="rarityStyle(analysisSelectedItem)"
                      x-text="nameLang==='cn' ? (itemSignals.name||analysisSelectedItem) : analysisSelectedItem"></p>
                    <p class="text-[10px]" style="color:#475569" x-text="nameLang==='cn' ? analysisSelectedItem : (itemSignals.name||'')"></p>
                  </div>
                </div>
                <div class="flex gap-1">
                  <template x-for="d in [30,60,90,0]">
                    <button @click="chartDays=d; renderPriceChart()"
                      class="px-2 py-0.5 rounded text-[10px]"
                      :class="chartDays===d?'bg-slate-600 text-white':'text-slate-500 hover:text-slate-300'"
                      x-text="d===0?(nameLang==='cn'?'全部':'All'):(d+(nameLang==='cn'?'天':'D'))"></button>
                  </template>
                </div>
              </div>
              <div class="relative" style="height:280px">
                <div id="priceChart"></div>
              </div>
            </div>

            <!-- Signal Gauges -->
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-4">
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1">RSI(14)
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'相对强弱指标 (14日)。>70 超买(可能回调)，<30 超卖(可能反弹)，50 中性。':'RSI(14). >70 overbought, <30 oversold, 50 neutral.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.rsi_14||0)>70?'text-red-400':(itemSignals.signal?.rsi_14||0)<30?'text-emerald-400':'text-slate-300'" x-text="itemSignals.signal?.rsi_14??'—'"></p>
                <p class="text-[9px] mt-0.5" :class="(itemSignals.signal?.rsi_14||0)>70?'text-red-500':'text-slate-600'" x-text="(itemSignals.signal?.rsi_14||0)>70?t('overbought'):(itemSignals.signal?.rsi_14||0)<30?t('oversold'):t('neutral_rsi')"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1">Bollinger %B
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'布林带位置。基于20日均线±2σ。>1 突破上轨(超涨)，<0 跌破下轨(超跌)，0.5 居中。':'Bollinger %B. Based on 20D MA ±2σ. >1 above upper band, <0 below lower, 0.5 mid.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.bb_position||0)>1?'text-red-400':(itemSignals.signal?.bb_position||0)<0?'text-emerald-400':'text-slate-300'" x-text="itemSignals.signal?.bb_position??'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="(itemSignals.signal?.bb_position||0)>1?t('above_upper'):(itemSignals.signal?.bb_position||0)<0?t('below_lower'):t('in_band')"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'7D 动量':'7D Momentum'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'7天价格变化率。(今价-7天前价)/7天前价×100%。正值=上涨趋势，负值=下跌趋势。':'7-day price change rate. Positive=uptrend, Negative=downtrend.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="pnlClass(itemSignals.signal?.momentum_7||0)" x-text="itemSignals.signal?.momentum_7!==null?(itemSignals.signal.momentum_7>0?'+':'')+itemSignals.signal.momentum_7+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'30D 动量':'30D Momentum'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'30天价格变化率。反映中期趋势方向和力度。>10% 强势上涨，<-10% 显著下跌。':'30-day price change rate. >10% strong rally, <-10% significant decline.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="pnlClass(itemSignals.signal?.momentum_30||0)" x-text="itemSignals.signal?.momentum_30!==null?(itemSignals.signal.momentum_30>0?'+':'')+itemSignals.signal.momentum_30+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'波动率':'Volatility'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'30日年化波动率。基于每日收益率标准差×√365。高波动=价格不稳定/交易机会大，低波动=稳定。':'30D annualized volatility. High=unstable/trading opportunities, Low=stable.'"></span></span></p>
                <p class="text-xl font-bold font-mono text-slate-300" x-text="itemSignals.signal?.volatility_30?itemSignals.signal.volatility_30+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'ATH 距离':'ATH Distance'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'当前价格占历史最高价的百分比。>90% 接近峰值(考虑出售)，<50% 远离高点(可能低估)。':'Price as % of all-time high. >90% near peak (sell?), <50% far from ATH.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.ath_pct||0)>90?'text-yellow-300':'text-slate-300'" x-text="itemSignals.signal?.ath_pct?itemSignals.signal.ath_pct+'%':'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="itemSignals.signal?.ath_price?'ATH ¥'+itemSignals.signal.ath_price:''"></p>
              </div>
              <!-- Rental Yield -->
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('rental_yield')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="t('rental_yield_desc')"></span></span></p>
                <p class="text-xl font-bold font-mono"
                  :class="rentalYield(itemSignals)>15?'text-emerald-400':rentalYield(itemSignals)>8?'text-yellow-300':rentalYield(itemSignals)>0?'text-orange-400':'text-slate-500'"
                  x-text="rentalYield(itemSignals)>0?rentalYield(itemSignals)+'%':'—'"></p>
                <p class="text-[9px] mt-0.5 text-slate-600" x-text="rentalYield(itemSignals)>15?(nameLang==='cn'?'高收益':'High'):rentalYield(itemSignals)>8?(nameLang==='cn'?'中等':'Medium'):rentalYield(itemSignals)>0?(nameLang==='cn'?'偏低':'Low'):''"></p>
              </div>
            </div>

            <!-- New Dimension Gauges (CS2 Dealer Model) -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'盈亏率':'P&L Rate'"></span>

              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_concentration')"></span>

                    <span class="tip-text" x-text="nameLang==='cn'?'该饰品市值占总持仓的百分比。>15%仓位过重需减仓，<5%正常。':'Portfolio weight %. >15% overweight, <5% normal.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.concentration_pct||0)>15?'text-red-400':(itemSignals.signal?.concentration_pct||0)>5?'text-orange-400':'text-slate-300'"
                  x-text="itemSignals.signal?.concentration_pct!=null?itemSignals.signal.concentration_pct+'%':'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_market_share')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'持有件数占市场在售总量的比例。>30%卖出可能造成砸盘，>10%需谨慎出货。':'Holding vs market supply. >30% selling may crash price, >10% trade carefully.'"></span></span></p>

              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="t('sig_vol_zscore')"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'该饰品波动率相对同类饰品的偏离程度(Z值)。>2为显著异常波动，<-1.5为异常平静。':'Volatility z-score vs peers. >2 = significant anomaly, <-1.5 = unusually calm.'"></span></span></p>

                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'日租金':'Daily Rent'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'悠悠有品市场日租金均价（CSQAQ 数据）。':'Average daily rental price on UUYP market (CSQAQ data).'"></span></span></p>
                <p class="text-xl font-bold font-mono text-emerald-400"
                  x-text="itemSignals.signal?.daily_rent?'¥'+itemSignals.signal.daily_rent:'—'"></p>
              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'Steam 成交量':'Steam Turnover'"></span>

                    <span class="tip-text" x-text="nameLang==='cn'?'Steam 市场近期成交量。高成交 = 流动性好，低成交 = 难出手。':'Steam market recent turnover. High = good liquidity.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.steam_turnover||0)>1000?'text-emerald-400':(itemSignals.signal?.steam_turnover||0)>200?'text-yellow-300':'text-orange-400'"

              </div>
              <div class="card p-3 text-center">
                <p class="text-[10px] text-slate-600 mb-1"><span x-text="nameLang==='cn'?'全球存世量':'Global Supply'"></span>
                  <span class="info-tip"><span class="inline-block w-3 h-3 rounded-full text-[8px] leading-3 text-center bg-slate-800 text-slate-500 ml-0.5">i</span>
                    <span class="tip-text" x-text="nameLang==='cn'?'全球饰品存世总量（CSQAQ 统计）。稀有度影响长期价值。':'Total global supply of this skin (CSQAQ stats). Rarity affects long-term value.'"></span></span></p>
                <p class="text-xl font-bold font-mono" :class="(itemSignals.signal?.global_supply||0)<5000?'text-purple-400':(itemSignals.signal?.global_supply||0)<50000?'text-yellow-300':'text-slate-300'"
                  x-text="itemSignals.signal?.global_supply!=null?itemSignals.signal.global_supply.toLocaleString():'—'"></p>
              </div>
            </div>

            <!-- Sell Score + Ownership -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">

                      x-text="itemSignals.ownership?.pnl!==null?((itemSignals.ownership.pnl>=0?'+':'')+'¥'+itemSignals.ownership.pnl+' ('+itemSignals.ownership.pnl_pct+'%)'):'—'"></span>
                  </div>
                  <div class="flex justify-between"><span class="text-slate-500" x-text="nameLang==='cn'?'持有件数':'Held'"></span><span class="font-mono text-slate-300" x-text="itemSignals.ownership?.count??'—'"></span></div>
                  <div class="flex justify-between" x-show="itemSignals.ownership?.target_pnl_pct"><span class="text-slate-500" x-text="nameLang==='cn'?'目标收益':'Target'"></span><span class="font-mono text-slate-300" x-text="itemSignals.ownership?.target_pnl_pct?itemSignals.ownership.target_pnl_pct+'%':'—'"></span></div>
                </div>

                      <td class="py-2 px-2 text-right font-mono text-slate-400" x-text="p.bidding_price?'¥'+p.bidding_price:'—'"></td>
                      <td class="py-2 px-2 text-right font-mono text-slate-500" x-text="p.sell_count??'—'"></td>

            <option value="critical" x-text="t('level_critical')"></option>
            <option value="warning" x-text="t('level_warning')"></option>
            <option value="info" x-text="t('level_info')"></option>

            <option value="spread_arb">Spread</option>

          </label>

              <div class="flex-1 min-w-0">
                <p class="text-xs font-medium text-slate-300 truncate" x-text="a.title"></p>
                <p class="text-[10px] text-slate-600 mt-0.5" x-text="a.detail"></p>
                <p class="text-[10px] text-slate-700 mt-0.5" x-text="a.created_at?.replace('T',' ').slice(0,16)"></p>

              <div class="flex gap-2 flex-shrink-0">
                <button x-show="!a.is_read" @click="markAlertRead(a)" class="text-[10px] text-slate-500 hover:text-slate-300" x-text="t('btn_read')"></button>
